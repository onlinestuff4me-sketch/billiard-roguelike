      .mode-card:active { background: rgba(234, 246, 255, 0.09); }
      .mode-card.is-current {
        border-color: rgba(34, 232, 255, 0.5);
        background: rgba(34, 232, 255, 0.08);
        cursor: default;
      }
      .mode-name {
        display: block;
        font-size: clamp(15px, 4vmin, 19px);
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--bone);
      }
      .mode-desc {
        display: block;
        margin-top: 3px;
        font-size: clamp(11px, 2.9vmin, 13px);
        line-height: 1.32;
        color: var(--muted);
        text-wrap: balance;
      }
      .mode-tag {
        display: inline-block;
        margin-top: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #04120e;
        background: var(--cyan);
      }
      .mode-tag.alt {
        color: #9aa6b2;
        background: transparent;
        border: 1px solid rgba(234, 246, 255, 0.22);
      }

      /* ---- the coaching band -------------------------------------- *
         OPTION C: THE RAIL AND THE ROUTE. See docs/COACHING.md.

         One sentence, on a strip of FIXED height pinned between the HUD and
         the felt. It never moves, never fades and never overlaps the table,
         which is the whole point: the card this replaces lived over the play
         area at 12.5% and had to drop to nine per cent opacity the instant a
         thumb went down, so the words were taken away at exactly the moment
         the player might want to re-read them.

         The vertical budget it belongs to:
           0-11%    HUD band
           11-19%   this band, fixed, whatever the state
           28-64%   every rack, every target, every route
           ~70%     the ball's spawn
           70-100%  where the thumb goes

         Four states — instruct, aiming, missed, complete — differ only in the
         sentence and the colour. Nothing appears, nothing disappears, nothing
         moves, so there is no animation to wait through and no layout shift to
         re-find the words after.                                              */
      #coach {
        position: absolute;
        left: 0;
        right: 0;
        /* ANCHORED TO THE TABLE, NOT TO A PERCENTAGE.
           The camera frames the arena edge to edge, so the felt has no margin
           and there is exactly one horizontal strip of it with nothing in it:
           between the bottom of the far corner pockets and the top of anything
           a board can place. `--coach-top` is that strip's top edge, measured
           from the live pocket geometry on every resize (see layoutBand in
           main.js). The 11% fallback is what it works out to on a 9:16 phone —
           it is here so the band still lands somewhere sane if it is ever
           shown before a layout pass, not as the real answer. */
          top: var(--coach-top, 11%);
        display: flex;
        align-items: center;
        gap: 10px;
        /* FIXED HEIGHT, TWO LINES OF ROOM. The band's value is that it is
           always the same shape in the same place; sizing it to its content
           would give that away on the first board whose sentence wraps. Two
           lines at this size is about 64 characters, which is the budget every
           string in RULES is written to. */
        height: 46px;
        padding: 0 12px;
        box-sizing: border-box;
        background: rgba(5, 7, 10, 0.94);
        border-top: 1px solid rgba(29, 111, 122, 0.35);
        border-bottom: 1.5px solid rgba(29, 111, 122, 0.55);
        opacity: 0;
        transition: opacity 0.22s ease, border-color 0.24s ease;
        /* Pointer-transparent as a whole so it can never eat an aim; only the
           Next button takes taps. */
        pointer-events: none;
        z-index: 40;
      }
      #coach.show { opacity: 1; }

      #coach .line {
        flex: 1;
        min-width: 0;
        font-size: clamp(12px, 3.2vmin, 15px);
        font-weight: 700;
        line-height: 1.18;
        letter-spacing: -0.005em;
        color: var(--bone, #eaf6ff);
        /* Two lines, then clip. A third would push the band's height around,
           and a sentence needing three lines is the wrong sentence — the
           endpoint tags on the felt carry what will not fit. */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-wrap: balance;
      }
      /* THE SAME COLOUR ALLOCATION AS THE TABLE. A ball named in the sentence
         takes the rack's amber and the good thing takes green, so the word and
         the object it names are the same colour. Pocket names stay the band's
         own bone-white, which is what a called pocket is lit in. */
      #coach .line b {
        font-weight: 800;
        color: var(--amber, #ffb340);
      }
      #coach .line em {
        font-style: normal;
        font-weight: 800;
        color: #2ef2c4;
      }
      #coach.bad .line { color: #ff8f7a; }
      #coach.bad .line b,
      #coach.bad .line em { color: #ff5a3d; }
      #coach.good .line { color: #2ef2c4; }
      #coach.good .line b,
      #coach.good .line em { color: #2ef2c4; }

      #coach.bad { border-bottom-color: #ff5a3d; }
      #coach.good { border-bottom-color: #2ef2c4; }

      /* Where the old card's "Lesson 2 of 6" eyebrow went. Two numerals,
         because the sentence has the left side and a player two boards in
         wants to know how many are left rather than read the phrase again. */
      #coach .prog {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        white-space: nowrap;
      }
      #coach .prog[hidden] { display: none; }
      #coach .progNum {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: #7c8794;
      }
      /* THE BAR AND THE NUMERALS BOTH. The numerals say exactly how many are
         left; the bar says how far along you are without being read at all.
         Fixed width so the band's shape does not move from board to board —
         the same reason the band itself is a fixed height. */
      #coach .progBar {
        display: block;
        width: 46px;
        height: 3px;
        border-radius: 999px;
        background: rgba(124, 135, 148, 0.28);
        overflow: hidden;
      }
      #coach .progBar i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: #2ef2c4;
        transform-origin: left center;
        transform: scaleX(0);
        transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1);
      }

      /* The CTA takes the progress chip's PLACE rather than sitting beside it:
         on a finished board there is exactly one control, and it goes forward. */
      #coach .next {
        display: block;
        padding: 6px 15px;
        font-family: inherit;
        font-size: clamp(11.5px, 3vmin, 14px);
        font-weight: 800;
        letter-spacing: 0.02em;
        white-space: nowrap;
        color: #04120e;
        background: #2ef2c4;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 0 22px rgba(46, 242, 196, 0.5);
        animation: nextPop 0.28s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      /* Gated on .show: a hidden band must not leave a live target behind, and
         opacity alone does not stop hit-testing. */
      #coach.show .next { pointer-events: auto; }
      #coach .next:active { transform: scale(0.96); }
      #coach .next[hidden] { display: none; }
      @keyframes nextPop {
        from { transform: scale(0.7); opacity: 0; }
        to   { transform: scale(1); opacity: 1; }
      }

      /* THE CARD ARRIVES; THE TABLE DOES NOT MOVE.
         A finished board freezes exactly as the stroke left it (Tutorial's
         _freeze — the rack used to be blown up here, which read as three more
         balls being pocketed). With nothing moving on the felt, the change of
         state has to be carried by the card, so the new sentence and the CTA
         come in together rather than the text swapping in place. */
      #coach.done .line {
        animation: doneSay 0.32s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      @keyframes doneSay {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* A COMPLETED LESSON IS NOT A LIVE TABLE. The felt behind dims so the eye
         goes to the one live control, and the table stops taking shots (see
         Tutorial.awaitingNext, read by the input gate). */
      #coach.done::after {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(5, 7, 10, 0.42);
        z-index: -1;
        pointer-events: none;
        animation: doneVeil 0.4s ease both;
      }
      @keyframes doneVeil { from { opacity: 0; } to { opacity: 1; } }

      /* The spotlight scrim still steps back while a thumb is down — it dims
         the felt, and dim felt is useful while READING about the table and
         squarely unhelpful while aiming across it. The band does not, because
         it is not on the felt in the first place. */
      #ui-layer.aiming #coach-spot.show { opacity: 0.3; }
      #coach-spot { transition: opacity 0.16s ease; }

      /* THE WAY OUT LIVES IN THE HUD, NOT IN THE BAND.
         The band has room for one sentence and one control, and the control
         has to be the one that moves forward; a way out beside it at the same
         size is a way out that gets pressed by mistake. The HUD's score,
         mission and stroke readouts are all hidden during a lesson, so this
         corner is free. */
      #coach-skip {
        position: absolute;
        /* TOP CENTRE, not a corner. The two far corner pockets live in the
           corners of this band — that is the whole reason the hull readout is
           hidden during a lesson — so a control parked in either one is a
           control sitting in a pocket. The middle of the top edge is the only
           part of it that is never table. */
        top: calc(var(--hud-pad) + 1px);
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 11px;
        font-family: inherit;
        font-size: clamp(9px, 2.4vmin, 11px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6c7784;
        background: rgba(5, 7, 10, 0.5);
        border: 1px solid rgba(234, 246, 255, 0.14);
        border-radius: 999px;
        cursor: pointer;
        pointer-events: auto;
        z-index: 41;
      }
      #coach-skip:active { color: var(--bone); }
      #coach-skip[hidden] { display: none; }

      /* ---- the scratch warning --------------------------------------- *
         The only words left on the felt. This layer used to label every route
         endpoint — YOUR BALL, 2 STOPS HERE, 1 → SIDE POCKET — and all of them
         named a place the picture was already showing, in type the eye had to
         leave the table to read, each one then needing to be kept clear of
         everything it might cover.

         The ghosts say all of that better. A scratch does not have a shape to
         say it with: it is a consequence, not a place, so it keeps its word.  */
      #coach-tags {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 38;
      }
      .coach-tag {
        position: absolute;
        /* Positioned by a solve, not by a rule. Tutorial._updateTags scores
           eight positions around the point against every ball, pocket and
           ghost on screen and takes the one that covers nothing — a fixed
           offset put the label on the 2 on the board whose whole sentence is
           about the 2. The transform is set from script; this is the default
           for the frame before the first solve runs. */
        transform: translate(-50%, -50%);
        padding: 3px 8px;
        border-radius: 6px;
        /* Bigger and heavier than the first pass. These were sized like a
           chart annotation and read like one: correct, and invisible at arm's
           length on a phone in a lit room over a moving table. */
        font-size: clamp(10px, 2.7vmin, 12.5px);
        font-weight: 800;
        letter-spacing: 0.08em;
        white-space: nowrap;
        /* Near-opaque, so the label never has to compete with whatever felt,
           grid line or route happens to be behind it, and a halo so its edge
           survives crossing a bright line. */
        background: rgba(3, 5, 8, 0.94);
        border: 1.5px solid currentColor;
        box-shadow: 0 0 12px rgba(3, 5, 8, 0.9);
        text-shadow: 0 1px 2px rgba(3, 5, 8, 0.9);
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      .coach-tag.show { opacity: 1; }
      .coach-tag.bad { color: #ff5a3d; }
      @media (prefers-reduced-motion: reduce) {
        .menu-title .ln { animation: none; }
      }

      /* ---------------- TYPE (Lightline) ----------------
         Display face for names, number face for figures. Kept in one block so
         the type system can be read, and tuned, in one place. */
      .banner-title, #boot-veil h1, .mo-kicker, .mo-freeze-label b, .mo-glitch,
      .card-title, .mo-roomnum small {
        font-family: var(--font-display);
      }
      .score-value, .sf-box, .sf-product, .sf-plate b, .mo-row .v, .mo-total .v,
      .mo-charge b {
        font-family: var(--font-num);
        font-variant-numeric: tabular-nums;
      }
      /* Orbitron runs wide: titles set in it come down a size and a step of tracking. */
      .mo-kicker { font-size: 24px; letter-spacing: 0.1em; }
      .mo-freeze-label b { font-size: 21px; letter-spacing: 0.1em; }
      .mo-glitch { font-size: 40px; letter-spacing: 0.06em; }
      .banner-title { letter-spacing: 0.08em; }
      .mo-next-label { font-size: 11px; letter-spacing: 0.24em; }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="stage">
        <canvas id="stage-canvas"></canvas>
        <div id="ui-layer"></div>
        <div id="boot-veil">
          <div class="menu-inner" id="menu-main">
            <h1 class="menu-title" aria-label="Lightline: Billiard Roguelike">
              <span class="ln">Lightline</span>
            </h1>
            <p class="menu-eyebrow">Billiard Roguelike</p>
            <button id="btn-play" class="menu-btn primary" type="button">Play</button>
            <div class="menu-row">
              <button id="btn-modes" class="menu-btn" type="button">Modes</button>
              <button id="btn-settings" class="menu-btn" type="button">Settings</button>
              <button id="btn-mute" class="menu-btn" type="button" aria-pressed="false">Sound&nbsp;on</button>
            </div>
          </div>

          <!-- MODES. A previous design is a previous VERSION, not a variant, so
               each mode is its own built page rather than a flag on this one.
               See scripts/snapshot-classic.mjs for why. -->
          <div class="menu-inner" id="menu-modes" hidden>
            <h2 class="menu-sub">Modes</h2>
            <button class="mode-card is-current" id="mode-rack" type="button">
              <span class="mode-name">Sink the Rack</span>
              <span class="mode-desc">The table is still between shots. Call a pocket, spend your strokes, run the rack.</span>
              <span class="mode-tag">Playing now</span>
            </button>
            <button class="mode-card" id="mode-strict" type="button">
              <span class="mode-name">Strict Order</span>
              <span class="mode-desc">The order stops being a bonus. Sink one out of turn and it comes back, and the shot pays nothing.</span>
              <span class="mode-tag alt" id="mode-strict-tag">Locked</span>
            </button>
            <a class="mode-card" id="mode-classic" href="./classic/">
              <span class="mode-name">Classic</span>
              <span class="mode-desc">The original real-time build. Targets close on you between shots and the stripes shoot back.</span>
              <span class="mode-tag alt">Archived</span>
            </a>
            <button id="mode-back" class="menu-btn primary" type="button">Done</button>
          </div>

          <div class="menu-inner" id="menu-settings" hidden>
            <h2 class="menu-sub">Settings</h2>
            <button id="set-mute" class="menu-btn" type="button">Sound: On</button>
            <button id="set-aim" class="menu-btn" type="button">Aim line: Slim</button>
            <button id="set-cue-stickLook" class="menu-btn" type="button">Stick: Rod</button>
            <button id="set-cue-maxStyle" class="menu-btn" type="button">Full power: Flash</button>
            <button id="set-cue-strikeStyle" class="menu-btn" type="button">Strike: Snap</button>
            <button id="set-tutorial" class="menu-btn" type="button">Replay tutorial</button>
            <button id="set-back" class="menu-btn primary" type="button">Done</button>
            <p class="menu-foot" id="set-tutorial-state"></p>
          </div>
        </div>
      </div>
    </div>
    <div id="rotate-hint">Rotate your device to portrait</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
