    <title>Lightline: Billiard Roguelike</title>
    <!-- Lightline's three faces are served from ./fonts (SIL OFL 1.1, see
         public/fonts/README.md). Every use has a fallback. -->
    <style>
      @font-face { font-family: 'Orbitron'; font-style: normal; font-weight: 700; font-display: swap; src: url('./fonts/orbitron-700.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      @font-face { font-family: 'Oxanium'; font-style: normal; font-weight: 700; font-display: swap; src: url('./fonts/oxanium-600.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 600; font-display: swap; src: url('./fonts/rajdhani-600.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 700; font-display: swap; src: url('./fonts/rajdhani-700.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      /* ---------------------------------------------------------------
         Dark Velvet Cyber-Billiards — shell styling.
         The game itself renders into #stage-canvas; every readable UI
         element is DOM so text stays crisp on high-DPI phones.
         --------------------------------------------------------------- */
      :root {
        /* Lightline tokens (docs/DESIGN_BIBLE.md §3). */
        --obsidian: #02050b;
        --felt-deep: #02050b;
        --felt: #061222;
        --cyan: #22e8ff;
        --magenta: #ff2e7e;
        --ice: #bff4ff;
        --amber: #ffb340;
        --violet: #a05cff;
        --bone: #eaf6ff;
        --muted: rgba(234, 246, 255, 0.55);
        --hud-pad: clamp(10px, 3.2vmin, 20px);
        --font: 'Rajdhani', 'Bahnschrift', 'Chakra Petch', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        /* Display: titles, banners, moment names. Wide, so used with restraint. */
        --font-display: 'Orbitron', 'Eurostile', 'Rajdhani', 'Arial Black', sans-serif;
        /* Numbers: every figure, with tabular digits. */
        --font-num: 'Oxanium', 'Bahnschrift', 'Rajdhani', ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--bone);
        font-family: var(--font);
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        /* Mobile Safari inflates text in blocks it thinks are too narrow to
           read, which silently undoes every size measured into a fixed box. */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /* Letterbox host: fills the viewport, centers the 9:16 stage. */
      #shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(120% 80% at 50% 0%, #0a1016 0%, #05070a 55%, #000 100%);
      }

      /* The fixed 9:16 portrait stage. JS sizes it precisely; the CSS here is
         the pre-boot fallback so the first paint is already the right shape. */
      #stage {
        position: relative;
        aspect-ratio: 9 / 16;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
        border-radius: clamp(0px, 1.6vmin, 14px);
        box-shadow:
          0 0 0 1px rgba(34, 232, 255, 0.16),
          0 0 60px rgba(34, 232, 255, 0.07),
          0 24px 80px rgba(0, 0, 0, 0.85);
        background: var(--obsidian);
        touch-action: none;
      }

      #stage-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* All HUD / modal DOM lives here. Children opt back into pointer events. */
      #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        font-family: var(--font);
      }

      /* ---------------- HUD ---------------- */
      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .hud-label {
        font-size: clamp(8px, 2.1vmin, 11px);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.35em;
      }

      /* The corner pockets sit exactly where the HUD's corners do — that is
         what a 9:16 table with pockets at its corners means — so the top band
         gets a scrim of its own rather than fighting a glowing rim for
         legibility. */
      .hud-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: var(--hud-pad) var(--hud-pad) calc(var(--hud-pad) * 0.9);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        background: linear-gradient(to bottom, rgba(5, 7, 10, 0.82) 0%, rgba(5, 7, 10, 0.55) 60%, transparent 100%);
      }

      /* Fixed side columns, so the mission stays centred however wide the
         RUN number grows. Nothing in the top bar moves when a score lands. */
      .hud-hp {
        flex: 0 0 28%;
        min-width: 0;
      }

      .hp-bar {
        position: relative;
        height: clamp(7px, 1.8vmin, 11px);
        border-radius: 999px;
        background: rgba(234, 246, 255, 0.1);
        box-shadow: inset 0 0 0 1px rgba(34, 232, 255, 0.18);
        overflow: hidden;
      }

      .hp-ghost,
      .hp-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 999px;
        width: 100%;
      }

      .hp-ghost {
        background: rgba(255, 61, 139, 0.45);
      }

      .hp-fill {
        background: linear-gradient(90deg, #22e8ff 0%, #7dfbe0 100%);
        box-shadow: 0 0 12px rgba(34, 232, 255, 0.65);
        transition: width 0.12s linear;
      }

      .hp-fill.critical {
        background: linear-gradient(90deg, #ff3d8b 0%, #ffb340 100%);
        box-shadow: 0 0 14px rgba(255, 61, 139, 0.8);
      }

      .hp-text {
        margin-top: 0.4em;
        font-size: clamp(9px, 2.3vmin, 12px);
        letter-spacing: 0.14em;
        color: var(--muted);
      }

      /* LIVES: three pips, lit while you have them. CASH under them, in heat. */
      .lives-row { display: flex; gap: 6px; margin-top: 4px; min-height: 14px; }
      .lives-row .life {
        width: clamp(10px, 2.8vmin, 14px);
        height: clamp(10px, 2.8vmin, 14px);
        border-radius: 50%;
        border: 1.5px solid rgba(34, 232, 255, 0.35);
      }
      .lives-row .life.on {
        background: radial-gradient(circle at 35% 35%, #e9f8ff 0%, #22e8ff 55%, #0b8fa6 100%);
        border-color: #22e8ff;
        box-shadow: 0 0 8px rgba(34, 232, 255, 0.7);
      }
      .cash-value {
        margin-top: 5px;
        font-family: var(--font-num);
        font-size: clamp(14px, 4vmin, 20px);
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: #ffc266;
        text-shadow: 0 0 10px rgba(255, 138, 30, 0.5);
      }

      /* THE MISSION.
         The one thing on screen that says what winning means, written as a
         sentence. It sits dead centre of the top band because that is where
         the eye lands between strokes. */
      /* YOUR SCORE takes the centre (from review); the mission sits right. */
      .hud-mission {
        order: 3;
        flex: 0 0 28%;
        text-align: right;
        min-width: 0;
      }

      .mission-text {
        font-size: clamp(11px, 3.1vmin, 16px);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0.1em;
        color: var(--bone);
        text-shadow: 0 0 16px rgba(34, 232, 255, 0.45);
      }
      .mission-text.done {
        color: #2ef2c4;
        text-shadow: 0 0 16px rgba(46, 242, 196, 0.6);
      }

      .mission-pips {
        margin-top: 0.45em;
        display: flex;
        gap: 3px;
        justify-content: flex-end;
      }
      .mission-pips .pip {
        width: clamp(9px, 2.6vmin, 14px);
        height: 3px;
        border-radius: 2px;
        background: rgba(34, 232, 255, 0.22);
        transition: background 0.18s ease;
      }
      .mission-pips .pip.on {
        background: var(--cyan);
        box-shadow: 0 0 8px rgba(34, 232, 255, 0.8);
      }

      /* WHICH BALL THE ORDER WANTS NEXT.
         Quiet by default — it is a bonus, not a demand, and a line that shouts
         reads as a rule. It brightens only while a run is actually going, and
         turns red in the mode where the order is not optional. */
      .mission-order {
        margin-top: 0.35em;
        font-size: clamp(7px, 1.9vmin, 10px);
        font-weight: 700;
        letter-spacing: 0.18em;
        color: rgba(234, 246, 255, 0.42);
        transition: color 0.2s ease, text-shadow 0.2s ease;
      }
      .mission-order.on {
        color: #2ef2c4;
        text-shadow: 0 0 10px rgba(46, 242, 196, 0.5);
      }
      .mission-order.strict {
        color: #ff5a3d;
        text-shadow: 0 0 10px rgba(255, 90, 61, 0.45);
      }

      .hud-score {
        order: 2;
        flex: 1 1 0;
        text-align: center;
        min-width: 0;
      }
      .score-value {
        display: inline-block;
        transform-origin: 50% 50%;
        font-size: clamp(17px, 5vmin, 28px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--bone);
      }
      .score-table {
        display: block;
        min-height: 13px;
        margin-top: 3px;
        transform-origin: 50% 50%;
        font-family: var(--font-num);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        color: var(--muted);
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .score-bar { position: relative; width: clamp(90px, 30vw, 140px); height: 5px; margin: 5px auto 0; background: rgba(30, 79, 107, 0.7); }
      .score-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--bone); transition: width 0.3s ease-out; }
      .score-bar.beaten .fill { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
      .score-table.on { opacity: 1; }
      .score-table.beaten { color: var(--cyan); }
      .score-table small { font-family: var(--font); font-size: 8px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); margin-right: 3px; }

      /* Owned-boon chips */
      .hud-build {
        position: absolute;
        top: calc(var(--hud-pad) + clamp(52px, 12vmin, 76px));
        left: var(--hud-pad);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        max-width: 46%;
      }

      .build-chip {
        display: flex;
        align-items: center;
        gap: 0.45em;
        padding: 0.22em 0.6em;
        border-radius: 999px;
        font-size: clamp(8px, 2.1vmin, 11px);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: rgba(5, 7, 10, 0.66);
        border: 1px solid rgba(234, 246, 255, 0.22);
        color: rgba(234, 246, 255, 0.9);
        backdrop-filter: blur(2px);
      }

      .build-chip.rare {
        border-color: rgba(34, 232, 255, 0.75);
        box-shadow: 0 0 10px rgba(34, 232, 255, 0.25);
      }

      .build-chip.epic {
        border-color: rgba(255, 61, 139, 0.8);
        box-shadow: 0 0 12px rgba(255, 61, 139, 0.3);
      }

      .chip-glyph {
        font-size: 1.15em;
        line-height: 1;
      }

      .build-chip.phase-launch .chip-glyph { color: var(--amber); }
      .build-chip.phase-trajectory .chip-glyph { color: var(--cyan); }
      .build-chip.phase-impact .chip-glyph { color: var(--magenta); }
      .build-chip.phase-rebound .chip-glyph { color: var(--violet); }

      .chip-rank {
        color: var(--amber);
        font-weight: 700;
      }

      /* Combo counter */
      /* THE SCOREBOARD. This is the only running read on how well the shot is
         going, and it used to be two lines of unbacked text over the felt —
         legible against dark table, invisible against a bloom. It is a pill
         now, with the chain's own countdown drawn under it. */
      .hud-combo {
        position: absolute;
        right: var(--hud-pad);
        top: 40%;
        text-align: right;
        padding: 7px 12px 9px;
        border-radius: 12px;
        background: rgba(5, 7, 10, 0.62);
        border: 1px solid rgba(34, 232, 255, 0.35);
        box-shadow: 0 0 24px rgba(34, 232, 255, 0.18);
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      .hud-combo.visible {
        opacity: 1;
      }

      .combo-mult {
        font-size: clamp(24px, 8vmin, 46px);
        font-weight: 700;
        line-height: 0.95;
        color: var(--cyan);
        text-shadow: 0 0 20px rgba(34, 232, 255, 0.75);
      }

      .combo-count {
        font-size: clamp(10px, 2.7vmin, 14px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.92);
      }

      /* The chain window, draining. Anchored right so it empties toward the
         edge the numbers are already aligned to. */
      .combo-bar {
        margin-top: 6px;
        height: 3px;
        border-radius: 2px;
        background: rgba(234, 246, 255, 0.16);
        overflow: hidden;
      }
      .combo-fill {
        height: 100%;
        border-radius: 2px;
        background: var(--cyan);
        transform-origin: right center;
        transform: scaleX(1);
        box-shadow: 0 0 10px rgba(34, 232, 255, 0.8);
      }

      .hud-combo.pop .combo-mult {
        animation: combo-pop 0.22s ease-out;
      }

      @keyframes combo-pop {
        0% { transform: scale(1.45); }
        100% { transform: scale(1); }
      }

      /* A lesson has no mission, no stroke budget and no way to be hurt, so
         every one of these would be stating a number nothing is enforcing.
         They fade in together with the first real room.

         The hull bar joins them for a second reason as well: the table is
         framed edge to edge, so the two far corner pockets sit UNDER this
         band, and two of the six boards call one of them. A board that lights
         a pocket to say "there" and then covers it has not pointed at
         anything. With the readouts gone the corners are clear felt. */
      #ui-layer.coaching .hud-mission,
      #ui-layer.coaching .hud-strokes,
      #ui-layer.coaching .hud-score,
      #ui-layer.coaching .hud-hp,
      #ui-layer.coaching .hud-freeze {
        opacity: 0;
        pointer-events: none;
      }
      .hud-mission, .hud-strokes, .hud-score, .hud-hp {
        transition: opacity 0.45s ease;
      }

      /* THE BUDGET, AS COUNTABLE MARKS.
         A number you have to read is a number that does not get read mid-shot.
         Lit cues are strokes you still have; dark ones are strokes you spent. */
      /* THE BOTTOM ROW: shots on the left, the score boxes in the middle,
         Freeze frame on the right. The camera keeps the table above it. */
      .hud-strokes {
        position: absolute;
        bottom: calc(var(--hud-pad) + 2px);
        left: var(--hud-pad);
        padding: 6px 14px;
        border-radius: 10px;
        background: rgba(5, 7, 10, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .stroke-row {
        display: flex;
        gap: clamp(4px, 1.3vmin, 7px);
        align-items: flex-end;
      }
      .stroke-row .cue {
        width: clamp(4px, 1.2vmin, 6px);
        height: clamp(18px, 5vmin, 28px);
        border-radius: 3px;
        background: var(--amber);
        box-shadow: 0 0 10px rgba(255, 179, 64, 0.55);
        transition: background 0.2s ease, box-shadow 0.2s ease;
      }
      .stroke-row .cue.spent {
        background: rgba(255, 179, 64, 0.16);
        box-shadow: none;
      }
      .stroke-row.last .cue:not(.spent) {
        background: var(--magenta);
        box-shadow: 0 0 14px rgba(255, 61, 139, 0.8);
        animation: cue-pulse 0.9s ease-in-out infinite;
      }

      .stroke-text {
        font-size: clamp(7px, 1.9vmin, 10px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Freeze charges. Diamonds, because freeze is the one power that stops
         the table, and nothing else on the HUD is a diamond. */
      .hud-freeze {
        position: absolute;
        bottom: calc(var(--hud-pad) + 2px);
        right: var(--hud-pad);
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(5, 7, 10, 0.6);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        opacity: 0.85;
        transition: opacity 0.3s ease;
      }
      .hud.has-freeze .hud-freeze { opacity: 1; }

      .freeze-row { display: flex; gap: 5px; }
      .freeze-row .frz {
        width: clamp(8px, 2.2vmin, 11px);
        height: clamp(8px, 2.2vmin, 11px);
        transform: rotate(45deg);
        border: 1.5px solid rgba(191, 244, 255, 0.6);
      }
      /* Ice: Freeze frame's own colour. A half charge fills half the diamond. */
      .freeze-row .frz.on {
        background: #bff4ff;
        border-color: #bff4ff;
        box-shadow: 0 0 10px rgba(111, 227, 255, 0.85);
      }
      .freeze-row .frz.half {
        background: linear-gradient(225deg, transparent 50%, #bff4ff 50%);
        border-color: rgba(191, 244, 255, 0.8);
      }

      /* THE SCORECARD. The moment the economy becomes legible: what the pots
         paid, and what the strokes you did not spend were worth. */
      .hud-card {
        position: absolute;
        left: 50%;
        top: 33%;
        transform: translate(-50%, -12px);
        width: min(78%, 330px);
        padding: 14px 16px 15px;
        border-radius: 8px;
        background: rgba(5, 7, 10, 0.93);
        border: 1px solid rgba(34, 232, 255, 0.34);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }
      .hud-card.visible {
        opacity: 1;
        transform: translate(-50%, 0);
        /* The card carries the exit buttons now, so it has to take taps. */
        pointer-events: auto;
      }

      .card-head { margin-bottom: 10px; }
      .card-status {
        font-size: clamp(8px, 2.1vmin, 11px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #2ef2c4;
      }
      .card-status.failed { color: var(--hazard, #ff5a3d); }
      .card-title {
        margin-top: 2px;
        font-size: clamp(14px, 4vmin, 20px);
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--bone);
      }

      .card-line, .card-total {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        align-items: baseline;
        padding: 4px 0;
        border-bottom: 1px solid rgba(234, 246, 255, 0.08);
      }
      .card-line .card-k {
        font-size: clamp(9px, 2.4vmin, 12px);
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.62);
      }
      .card-line .card-d {
        font-size: clamp(8px, 2vmin, 10px);
        color: rgba(234, 246, 255, 0.35);
      }
      .card-line .card-v {
        font-size: clamp(11px, 2.9vmin, 14px);
        font-weight: 700;
        color: var(--bone);
      }
      .card-line.hero .card-k, .card-line.hero .card-v { color: var(--amber); }
      .card-line.bad .card-v { color: #ff5a3d; }

      .card-totals { margin-top: 8px; }
      .card-total {
        grid-template-columns: 1fr auto;
        border-bottom: 0;
        padding: 3px 0;
      }
      .card-total .card-k {
        font-size: clamp(8px, 2.1vmin, 10px);
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.5);
      }
      .card-total .card-v {
        font-size: clamp(15px, 4.4vmin, 22px);
        font-weight: 700;
        color: var(--bone);
      }
      .card-total.run .card-v { color: var(--cyan); }

      .card-prompt {
        margin-top: 11px;
        padding-top: 9px;
        border-top: 1px solid rgba(234, 246, 255, 0.1);
        text-align: center;
        font-size: clamp(8px, 2.1vmin, 11px);
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.6);
      }

      /* THE EXIT BUTTONS. One per reward, stacked under the totals, each in
         its own reward colour. A tap, not a trick shot. */
      .card-choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
      }
      .card-choice {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 11px 14px;
        border-radius: 8px;
        border: 1px solid var(--c, #7df9ff);
        background: color-mix(in srgb, var(--c, #7df9ff) 12%, transparent);
        font-family: inherit;
        cursor: pointer;
        pointer-events: auto;
        text-align: left;
        transition: background 0.15s ease, transform 0.12s ease;
      }
      .card-choice:hover { background: color-mix(in srgb, var(--c, #7df9ff) 22%, transparent); }
      .card-choice:active { transform: scale(0.985); }
      .card-choice .choice-name {
        font-size: clamp(12px, 3.4vmin, 16px);
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--c, #7df9ff);
      }
      .card-choice .choice-detail {
        font-size: clamp(9px, 2.4vmin, 12px);
        font-weight: 600;
        color: rgba(234, 246, 255, 0.7);
        text-align: right;
      }


      /* THE FLOATING AIM PAD.
         Drawn under the thumb, carrying the cue's geometry: the ring is a full
         draw, the knob is the butt, and the line between them is the shot. It
         has to be legible over dark felt without competing with the trajectory
         preview, so it is bone-white at low alpha and entirely unfilled except
         for the power arc. */
      .aim-pad {
        position: absolute;
        left: var(--pad-x, 50%);
        top: var(--pad-y, 50%);
        width: 0;
        height: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.14s ease;
        z-index: 26;
      }
      .aim-pad.show { opacity: 1; }
      .pad-ring,
      .pad-fill {
        position: absolute;
        left: 0;
        top: 0;
        width: calc(var(--pad-r, 90px) * 2);
        height: calc(var(--pad-r, 90px) * 2);
        margin-left: calc(var(--pad-r, 90px) * -1);
        margin-top: calc(var(--pad-r, 90px) * -1);
        border-radius: 50%;
      }
      .pad-ring {
        border: 1.5px solid rgba(234, 246, 255, 0.22);
        box-shadow: inset 0 0 24px rgba(34, 232, 255, 0.06);
      }
      /* The power read, as a disc that grows to fill the ring. Radius, not
         colour: the palette's channels are all spoken for. */
      .pad-fill {
        transform: scale(var(--pad-power, 0));
        background: radial-gradient(
          circle,
          rgba(34, 232, 255, 0.14) 0%,
          rgba(34, 232, 255, 0.05) 70%,
          transparent 100%
        );
        border: 1px solid rgba(34, 232, 255, 0.3);
      }
      .pad-line {
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        width: var(--line-len, 0px);
        margin-top: -1px;
        transform-origin: 0 50%;
        transform: rotate(var(--line-rot, 0deg));
        background: linear-gradient(
          90deg,
          rgba(34, 232, 255, 0.75),
          rgba(34, 232, 255, 0.25)
        );
      }
      .pad-knob {
        position: absolute;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        transform: translate(var(--knob-x, 0px), var(--knob-y, 0px));
        border: 2px solid rgba(234, 246, 255, 0.65);
        background: rgba(5, 7, 10, 0.35);
        box-shadow: 0 0 16px rgba(34, 232, 255, 0.35);
      }

      /* Banner */
      /* Long banner subs ran edge to edge and wrapped badly, clipping letters
         at both margins. */
      .hud-banner { padding-inline: 20px; }
      .banner-sub { max-width: 88%; margin-inline: auto; }
      .banner-hint {
        margin-top: 14px;
        font-size: clamp(8px, 2.1vmin, 11px);
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.4);
      }

      .hud-banner {
        position: absolute;
        top: 34%;
        left: 0;
        right: 0;
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .hud-banner.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .banner-title {
        font-size: clamp(19px, 6.4vmin, 38px);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--bone);
        text-shadow: 0 0 22px rgba(34, 232, 255, 0.7);
      }

      .banner-sub {
        margin-top: 0.4em;
        font-size: clamp(10px, 2.8vmin, 15px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--amber);
      }

      /* World-projected exit-door reward labels */
      .hud-doors {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .door-label {
        position: absolute;
        left: 0;
        top: 0;
        padding: 0.28em 0.7em;
        border: 1px solid currentColor;
        border-radius: 999px;
        background: rgba(5, 7, 10, 0.72);
        font-size: clamp(9px, 2.4vmin, 13px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
        box-shadow: 0 0 14px rgba(0, 0, 0, 0.7);
      }

      /* Damage vignette */
      .hud-damage {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(
          120% 90% at 50% 50%,
          rgba(255, 61, 139, 0) 45%,
          rgba(255, 61, 139, 0.75) 100%
        );
      }

      /* ---------------- Boon modal ---------------- */
      .boon-scrim {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 5%;
        background: rgba(5, 7, 10, 0.86);
        backdrop-filter: blur(4px);
        pointer-events: auto;
      }

      .boon-scrim.visible {
        display: flex;
        animation: fade-in 0.22s ease;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .boon-panel {
        width: 100%;
        max-width: 460px;
        text-align: center;
      }

      .boon-title {
        font-size: clamp(17px, 5.4vmin, 30px);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--bone);
        text-shadow: 0 0 18px rgba(34, 232, 255, 0.55);
      }

      .boon-subtitle {
        margin-top: 0.35em;
        font-size: clamp(9px, 2.5vmin, 13px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--amber);
      }

      .boon-cards {
        margin-top: clamp(12px, 3.5vmin, 24px);
        display: flex;
        flex-direction: column;
        gap: clamp(8px, 2.2vmin, 14px);
      }

      .boon-card {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        padding: clamp(10px, 2.8vmin, 16px);
        border-radius: 12px;
        border: 1px solid rgba(234, 246, 255, 0.28);
        background: linear-gradient(160deg, rgba(13, 29, 45, 0.85) 0%, rgba(2, 5, 11, 0.92) 70%);
        color: var(--bone);
        font-family: var(--font);
        cursor: pointer;
        pointer-events: auto;
        transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      }

      .boon-card:active {
        transform: scale(0.985);
      }

      .boon-card.rare {
        border-color: rgba(34, 232, 255, 0.7);
        box-shadow: 0 0 18px rgba(34, 232, 255, 0.2);
      }

      .boon-card.epic {
        border-color: rgba(255, 61, 139, 0.85);
        box-shadow: 0 0 22px rgba(255, 61, 139, 0.28);
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: clamp(8px, 2.1vmin, 11px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      /*
       * Card hierarchy, largest to smallest: what it DOES, then the numbers,
       * then when it fires, then its name. The name used to lead and it is the
       * one line that cannot help you choose — "Chain Arc" means nothing until
       * you already own it.
       */
      .card-trigger { color: var(--cyan); }
      .boon-card.phase-launch .card-trigger { color: var(--amber); }
      .boon-card.phase-impact .card-trigger { color: var(--magenta); }
      .boon-card.phase-rebound .card-trigger { color: var(--violet); }
      .card-rarity { color: var(--muted); }

      .card-effect {
        margin-top: 0.34em;
        font-size: clamp(15px, 4.3vmin, 23px);
        font-weight: 700;
        line-height: 1.24;
        letter-spacing: 0.005em;
        color: var(--bone);
        max-width: 84%;
        text-wrap: balance;
      }

      .card-numbers {
        margin-top: 0.42em;
        font-size: clamp(11px, 3vmin, 15px);
        font-weight: 600;
        letter-spacing: 0.03em;
        color: var(--cyan);
        max-width: 88%;
        font-variant-numeric: tabular-nums;
      }
      .boon-card.phase-launch .card-numbers { color: var(--amber); }
      .boon-card.phase-impact .card-numbers { color: var(--magenta); }
      .boon-card.phase-rebound .card-numbers { color: var(--violet); }

      .card-foot {
        margin-top: 0.7em;
        display: flex;
        align-items: center;
        gap: 0.5em;
        font-size: clamp(8px, 2.2vmin, 11px);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .card-glyph {
        font-size: 1.5em;
        line-height: 1;
        opacity: 0.75;
      }

      .card-rank {
        margin-left: auto;
        color: var(--amber);
        letter-spacing: 0.14em;
      }

      .boon-empty {
        padding: 2em 1em;
        color: var(--muted);
        letter-spacing: 0.12em;
      }

      .boon-footer {
        margin-top: clamp(10px, 2.6vmin, 18px);
        font-size: clamp(9px, 2.3vmin, 12px);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* World-space floating combat text, projected from the scene each frame. */
      /* THE MAX POWER BADGE. A white Lightline plate (cut corners, dark ink)
         with a cyan halo: it is YOUR moment, so it wears your colour. */
      .max-badge {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 8;
        display: grid;
        justify-items: center;
        padding: 4px 12px 5px;
        color: #02050b;
        font-family: var(--font);
        pointer-events: none;
        white-space: nowrap;
        isolation: isolate;
        /* The glow sits on the element and the cut corners on its backing, so
           the clip never cuts the glow off. */
        filter: drop-shadow(0 0 12px rgba(34, 232, 255, 0.95)) drop-shadow(0 0 3px #22e8ff);
      }
      .max-badge::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: #e9f8ff;
        clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
      }
      .max-badge b { font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: 0.08em; }
      .max-badge small { font-size: 9px; font-weight: 700; letter-spacing: 0.32em; margin-top: 1px; }

      /* ---------------- THE SCORE FEED (src/ui/ScoreFeed.js) ----------------
         Lightline: white plates add POINTS, orange plates add MULT, gold plates
         multiply it, pink-red plates are taken back. Corners are cut, not
         rounded. Every number is presented beside its cause, then flown here. */
      #ui-layer.feed-on .hud-combo { display: none !important; }
      .score-feed {
        --ll-pts: #e9f8ff; --ll-mult: #ff8a1e; --ll-hot: #ffc266; --ll-void: #ff2e7e; --ll-you: #22e8ff;
        position: absolute;
        left: 50%;
        bottom: calc(var(--hud-pad) + 2px);
        transform: translateX(-50%);
        display: grid;
        justify-items: center;
        gap: 4px;
        pointer-events: none;
        z-index: 6;
      }
      .score-feed[hidden] { display: none; }
      .score-feed { transition: opacity 0.18s ease; }
      .score-feed.tucked { opacity: 0; }
      .sf-state {
        min-height: 11px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--muted);
        text-shadow: 0 1px 3px rgba(2, 5, 11, 0.9);
      }
      .sf-state.lock { color: var(--ll-you); }
      .sf-state.hazard { color: var(--ll-void); }
      .sf-boxes { position: relative; display: flex; align-items: center; gap: 8px; transition: gap 0.18s cubic-bezier(0.7, 0, 0.84, 0); }
      .sf-box {
        min-width: 60px;
        padding: 4px 9px 5px;
        text-align: center;
        font-family: var(--font);
        font-weight: 700;
        font-size: 21px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: #02050b;
        transition: opacity 0.2s ease;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      }
      .sf-box small { display: block; font-size: 8px; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.75; margin-bottom: 1px; }
      .sf-box.pts { background: var(--ll-pts); }
      .sf-box.mult { background: var(--ll-mult); }
      .sf-times { font-weight: 700; font-size: 17px; color: var(--muted); }
      .score-feed.pending .sf-box { opacity: 0.5; }
      .score-feed.void .sf-box { background: var(--ll-void); opacity: 1; }
      .score-feed.slam .sf-boxes { gap: 0; }
      .score-feed.slam .sf-times { color: var(--ll-hot); text-shadow: 0 0 14px var(--ll-mult); }
      .sf-product { display: none; font-weight: 700; font-size: 30px; line-height: 1; color: var(--ll-pts); text-shadow: 0 0 16px var(--ll-mult); font-variant-numeric: tabular-nums; }
      .score-feed.paid .sf-box, .score-feed.paid .sf-times { display: none; }
      .score-feed.paid .sf-product { display: block; }
      .score-feed.locking .sf-boxes::after {
        content: '';
        position: absolute;
        inset: -6px -10px;
        border: 2px solid var(--ll-you);
        box-shadow: 0 0 16px var(--ll-you);
        animation: sf-lock 0.5s ease-out forwards;
        pointer-events: none;
      }
      @keyframes sf-lock { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.45, 1.8); } }
      .sf-plates { position: absolute; inset: 0; pointer-events: none; z-index: 7; overflow: hidden; }
      .sf-plate {
        position: absolute;
        left: 0;
        top: 0;
        display: grid;
        justify-items: center;
        padding: 4px 11px 5px;
        color: #02050b;
        white-space: nowrap;
        font-family: var(--font);
        will-change: transform;
        isolation: isolate;
      }
      /* Cut corners on the backing, glow on the plate: a clip on the plate itself
         would cut its own glow off. */
      .sf-plate::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--plate-bg, #e9f8ff);
        clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
      }
      .sf-plate b { font-size: 26px; font-weight: 700; line-height: 1; }
      .sf-plate small { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; margin-top: 2px; text-transform: uppercase; }
      .sf-plate.pts { --plate-bg: #e9f8ff; filter: drop-shadow(0 0 10px rgba(233, 248, 255, 0.75)); }
      .sf-plate.mult { --plate-bg: #ff8a1e; filter: drop-shadow(0 0 12px rgba(255, 138, 30, 0.9)); }
      .sf-plate.xmult { --plate-bg: #ffc266; filter: drop-shadow(0 0 12px rgba(255, 138, 30, 0.9)); }
      .sf-plate.void { --plate-bg: #ff2e7e; filter: drop-shadow(0 0 10px rgba(255, 46, 126, 0.85)); }
      .sf-plate.void b { text-decoration: line-through; }
      .sf-streak { position: absolute; left: 0; top: 0; height: 3px; margin-top: -1.5px; transform-origin: 0 50%; border-radius: 2px; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { .sf-boxes { transition: none; } .score-feed.locking .sf-boxes::after { animation: none; opacity: 0; } }

      /* The 'lock' full-power moment: four chevrons close on the cue ball. */
      .lock-reticle { position: absolute; width: 64px; height: 64px; pointer-events: none; z-index: 8; filter: drop-shadow(0 0 6px #22e8ff) drop-shadow(0 0 14px rgba(34, 232, 255, 0.6)); }
      .lock-reticle i { position: absolute; width: 16px; height: 16px; border: 0 solid #e9fbff; }
      .lock-reticle i.n { left: 50%; top: -4px; margin-left: -8px; border-right-width: 3px; border-bottom-width: 3px; transform: rotate(45deg); }
      .lock-reticle i.s { left: 50%; bottom: -4px; margin-left: -8px; border-left-width: 3px; border-top-width: 3px; transform: rotate(45deg); }
      .lock-reticle i.w { top: 50%; left: -4px; margin-top: -8px; border-right-width: 3px; border-top-width: 3px; transform: rotate(45deg); }
      .lock-reticle i.e { top: 50%; right: -4px; margin-top: -8px; border-left-width: 3px; border-bottom-width: 3px; transform: rotate(45deg); }
      .lock-reticle b { position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%); font: 700 12px/1 var(--font); letter-spacing: 0.3em; color: #02050b; background: #e9fbff; padding: 3px 6px 3px 9px; clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px); }

      /* ---------------- MOMENTS (src/ui/Moments.js) ----------------
         The four beats between shots. Same language as the score feed:
         cut-corner plates, ink on light, one colour per meaning —
         cyan is you, white is points, orange is mult, pink is void. */
      .moments { position: absolute; inset: 0; pointer-events: none; z-index: 12; --ll-pts: #e9f8ff; --ll-mult: #ff8a1e; --ll-hot: #ffc266; --ll-void: #ff2e7e; --ll-you: #22e8ff; --ll-ice: #bff4ff; --ll-ink: #02050b; }
      .moments > * { position: absolute; inset: 0; }
      .mo-shade, .mo-scan, .mo-beam, .mo-rez, .mo-glitch, .mo-glitch-sub,
      .mo-freeze-label, .mo-stasis, .mo-arrow, .mo-strip, .mo-roomnum { position: absolute; }
      .mo-alarm, .mo-tear, .mo-flash, .mo-boot, .mo-shards, .mo-form { position: absolute; inset: 0; }
      .mo-fly { position: absolute; inset: auto; z-index: 30; font-weight: 700; color: var(--ll-pts); text-shadow: 0 0 18px var(--ll-you); white-space: nowrap; font-variant-numeric: tabular-nums; will-change: transform; }
      .mo-ring { position: absolute; inset: auto; width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--ll-you); box-shadow: 0 0 18px var(--ll-you), inset 0 0 12px var(--ll-you); pointer-events: none; }
      /* THE BANK PLATE: a score plate, bigger, carrying the table total to RUN. */
      .mo-bankplate { inset: auto; z-index: 31; }
      .mo-bankplate b { font-size: 34px; }
      .mo-bankstreak { inset: auto; left: 0; top: 0; z-index: 30; background: linear-gradient(90deg, transparent, #e9f8ff); box-shadow: 0 0 12px #22e8ff; }

      /* THE SHOP */
      .mo-shop { position: absolute; inset: auto; left: 50%; top: 9%; width: min(92%, 370px); padding: 16px 16px 12px; isolation: isolate; filter: drop-shadow(0 0 18px rgba(34, 232, 255, 0.3)); display: grid; gap: 10px; }
      .mo-shop::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(6, 18, 28, 0.97), rgba(2, 5, 11, 0.97)); border: 2px solid rgba(34, 232, 255, 0.75); clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px); }
      .mo-shop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .mo-shop .mo-kicker { font-size: 24px; }
      .mo-shop-points { display: grid; justify-items: end; }
      .mo-shop-points .k { font-size: 10px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
      .mo-shop-points .v { font-family: var(--font-num); font-size: 26px; font-weight: 800; color: var(--ll-pts); font-variant-numeric: tabular-nums; line-height: 1; }
      .mo-shop-note { font-size: 12px; color: rgba(233, 248, 255, 0.6); line-height: 1.3; }
      .mo-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; perspective: 700px; }
      .mo-card { position: relative; display: grid; grid-template-rows: auto auto 1fr auto auto; gap: 3px; min-height: 124px; padding: 10px 10px 9px; border: 0; text-align: left; font-family: var(--font); color: var(--bone); pointer-events: auto; background: rgba(13, 29, 45, 0.95); box-shadow: inset 0 0 0 1.5px var(--edge, #1e4f6b); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
      /* Rarity is the diamonds in the tag, never a colour: every card shares one edge. */
      .mo-card { --edge: #3a87a8; }
      .mo-card .r { font-size: 9px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(233, 248, 255, 0.7); }
      .mo-card .name { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; }
      .mo-card .text { font-size: 12px; line-height: 1.25; color: rgba(233, 248, 255, 0.78); }
      .mo-card .why { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ll-void); }
      .mo-card.poor .act.buy .p { color: var(--ll-void); }
      .mo-card.bought { box-shadow: inset 0 0 0 2px var(--ll-you); }
      .mo-shop-tools { display: grid; grid-template-columns: 1fr; gap: 8px; }
      .mo-tool { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 9px 12px; border: 0; font-family: var(--font); cursor: pointer; pointer-events: auto; color: var(--bone); background: rgba(13, 29, 45, 0.95); box-shadow: inset 0 0 0 1.5px var(--tc, #3a87a8); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
      .mo-tool .n { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tc, #3a87a8); }
      .mo-tool .p { font-family: var(--font-num); font-size: 15px; font-weight: 800; color: #ffc266; }
      .mo-tool.charge { --tc: #bff4ff; }
      .mo-tool[disabled] { opacity: 0.45; cursor: default; }
      .mo-owned { font-size: 11px; color: rgba(233, 248, 255, 0.55); }
      .mo-shop-points .v { color: #ffc266; }
      .mo-card .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
      .mo-card .act { display: grid; justify-items: center; gap: 1px; padding: 6px 4px; border: 0; cursor: pointer; pointer-events: auto; font-family: var(--font); color: var(--bone); background: rgba(2, 5, 11, 0.6); box-shadow: inset 0 0 0 1px rgba(233, 248, 255, 0.45); }
      .mo-card .act b { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
      .mo-card .act .p { font-family: var(--font-num); font-size: 15px; font-weight: 800; color: #ffc266; line-height: 1; }
      .mo-card .act small { font-size: 8px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; }
      .mo-card .act[disabled] { opacity: 0.4; cursor: default; }
      .mo-card .act.buy[aria-pressed="true"] { background: var(--ll-you); color: #02050b; box-shadow: none; opacity: 1; }
      .mo-card .act.hold[aria-pressed="true"] { background: var(--bone); color: #02050b; box-shadow: none; opacity: 1; }
      .mo-card .act:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
      .mo-card.held { box-shadow: inset 0 0 0 2px var(--bone); }

      /* YOUR SCORE AGAINST THE TARGET, under the ledger total: one bar, the
         tick is the target and the fill is what you scored. */
      .mo-target { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px 10px; padding: 8px 8px 0; opacity: 0; }
      .mo-target .k { font-size: 12px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
      .mo-target .d { font-family: var(--font-num); font-size: 18px; font-weight: 700; color: var(--bone); font-variant-numeric: tabular-nums; }
      .mo-target .stamp { padding: 4px 10px; font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #02050b; opacity: 0; }
      .mo-target.beaten .stamp { background: var(--ll-you); }
      .mo-target.missed .stamp { background: var(--ll-void); }
      .mo-vs { grid-column: 1 / -1; position: relative; height: 10px; background: rgba(30, 79, 107, 0.55); }
      .mo-vs .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ll-you); box-shadow: 0 0 10px rgba(34, 232, 255, 0.6); }
      .mo-target.missed .mo-vs .fill { background: var(--ll-void); box-shadow: 0 0 10px rgba(255, 46, 126, 0.6); }
      .mo-vs .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--bone); box-shadow: 0 0 6px rgba(233, 248, 255, 0.9); }

      /* CASH EARNED: its own panel, every line with its reason, and where it goes. */
      .mo-cashpanel { position: absolute; left: 50%; transform: translateX(-50%); width: min(90%, 360px); padding: 12px 18px 12px; display: grid; gap: 6px; isolation: isolate; filter: drop-shadow(0 0 14px rgba(255, 194, 102, 0.25)); }
      .mo-cashpanel::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(20, 14, 4, 0.96), rgba(2, 5, 11, 0.97)); border: 2px solid rgba(255, 194, 102, 0.7); clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
      .mo-cash-k { font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ffc266; }
      .mo-cash-rows { display: grid; gap: 3px; }
      .mo-cash-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; }
      .mo-cash-row .k { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bone); white-space: nowrap; }
      .mo-cash-row .d { font-size: 11px; color: rgba(233, 248, 255, 0.5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mo-cash-row .v { font-family: var(--font-num); font-size: 16px; font-weight: 800; color: #ffc266; font-variant-numeric: tabular-nums; }
      .mo-cash-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px; border-top: 1px solid rgba(255, 194, 102, 0.35); }
      .mo-cash-total .k { font-size: 12px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
      .mo-cash-total .v { display: inline-block; font-family: var(--font-num); font-size: 24px; font-weight: 800; color: #ffc266; font-variant-numeric: tabular-nums; }
      .mo-cash-dest { font-size: 12px; color: rgba(233, 248, 255, 0.7); text-align: right; }
      .mo-cash-dest b { font-family: var(--font-num); color: #ffc266; }
      .sf-plate.cash { --plate-bg: #ffc266; }
      .mo-nexttable { position: absolute; inset: auto; left: 50%; bottom: calc(var(--hud-pad) + 74px); padding: 13px 34px; border: 0; cursor: pointer; pointer-events: auto; font-family: var(--font-display); font-size: 16px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #02050b; background: var(--ll-you); box-shadow: 0 0 22px rgba(34, 232, 255, 0.6); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); white-space: nowrap; }
      .mo-charge { inset: auto; z-index: 31; --plate-bg: #bff4ff; filter: drop-shadow(0 0 12px rgba(111, 227, 255, 0.9)); }
      .mo-ring.ice { border-color: #bff4ff; box-shadow: 0 0 18px #6fe3ff, inset 0 0 12px #6fe3ff; }
      .mo-ring.big { width: 140px; height: 140px; border-color: var(--ll-pts); }

      /* CLEAR */
      .mo-clear { pointer-events: auto; }
      .mo-ledger {
        position: absolute; left: 50%; top: 10%; width: min(90%, 360px);
        padding: 18px 20px 16px; isolation: isolate;
        filter: drop-shadow(0 0 18px rgba(34, 232, 255, 0.35));
      }
      .mo-ledger::before {
        content: ''; position: absolute; inset: 0; z-index: -1;
        background: linear-gradient(180deg, rgba(6, 18, 28, 0.97), rgba(2, 5, 11, 0.97));
        border: 2px solid rgba(34, 232, 255, 0.75);
        clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
      }
      .mo-head { text-align: center; margin-bottom: 8px; }
      .mo-kicker { white-space: nowrap; font-size: 30px; font-weight: 800; letter-spacing: 0.16em; line-height: 1; text-transform: uppercase; color: var(--ll-you); text-shadow: 0 0 14px var(--ll-you); }
      .mo-title { margin-top: 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase; color: var(--muted); }
      .mo-rows { display: grid; gap: 4px; }
      .mo-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline; padding: 2px 8px; line-height: 1.15; font-variant-numeric: tabular-nums; }
      .mo-row .k { white-space: nowrap; font-size: 16px; font-weight: 800; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(233, 248, 255, 0.78); }
      .mo-row .d { font-size: 13px; font-weight: 600; color: rgba(233, 248, 255, 0.42); }
      .mo-row .v { font-size: 24px; font-weight: 800; color: var(--ll-pts); min-width: 4ch; text-align: right; }
      .mo-row.bonus .k, .mo-row.bonus .v { color: var(--ll-hot); text-shadow: 0 0 10px rgba(255, 138, 30, 0.6); }
      .mo-row.bad .k, .mo-row.bad .v { color: var(--ll-void); }
      .mo-rule { height: 2px; margin: 8px 0 6px; background: linear-gradient(90deg, transparent, var(--ll-you), transparent); transform-origin: 50% 50%; }
      .mo-total { display: flex; align-items: baseline; justify-content: space-between; padding: 0 8px; opacity: 0; }
      .mo-total .k { font-size: 14px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
      .mo-total .v { font-size: 48px; font-weight: 800; line-height: 1; color: var(--ll-pts); font-variant-numeric: tabular-nums; transform-origin: 100% 60%; display: inline-block; }
      .mo-total.slam .v { text-shadow: 0 0 20px var(--ll-you); }

      .mo-next { position: absolute; inset: auto 0 calc(var(--hud-pad) + 60px) 0; display: grid; justify-items: center; gap: 6px; padding: 0 9%; }
      .mo-next-label { font-size: 12px; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase; color: var(--ll-you); text-shadow: 0 0 10px var(--ll-you); }
      .mo-choices { display: grid; gap: 6px; width: 100%; max-width: 330px; }
      .mo-choice {
        position: relative; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px;
        padding: 10px 14px; border: 0; color: var(--bone); font-family: var(--font); text-align: left; cursor: pointer; pointer-events: auto;
        background: color-mix(in srgb, var(--c, #22e8ff) 16%, rgba(2, 5, 11, 0.92));
        box-shadow: inset 0 0 0 1px var(--c, #22e8ff), 0 0 16px color-mix(in srgb, var(--c, #22e8ff) 35%, transparent);
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        overflow: hidden;
      }
      .mo-choice::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.22) 50%, transparent 70%); transform: translateX(-120%); animation: mo-sheen 2.4s ease-in-out infinite; }
      .mo-choice:nth-child(2)::after { animation-delay: 0.3s; }
      .mo-choice:nth-child(3)::after { animation-delay: 0.6s; }
      @keyframes mo-sheen { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
      .mo-choice-name { font-size: 16px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c, #22e8ff); }
      .mo-choice-detail { font-size: 12px; font-weight: 600; color: rgba(233, 248, 255, 0.72); text-align: right; }
      .mo-choice-go { font-size: 16px; color: var(--c, #22e8ff); }
      .mo-choice.picked { background: var(--c, #22e8ff); }
      .mo-choice.picked * { color: var(--ll-ink); }

      .mo-shade { inset: auto 0 0 0; height: 0; background: rgba(2, 5, 11, 0.55); }
      .mo-scan { inset: auto 0 auto 0; height: 3px; margin-top: -1.5px; background: var(--ll-you); box-shadow: 0 0 16px 3px var(--ll-you), 0 0 60px 8px rgba(34, 232, 255, 0.4); }

      /* SCRATCH */
      .mo-beam { inset: auto; top: 0; width: 16px; transform-origin: 50% 0; background: linear-gradient(180deg, rgba(34, 232, 255, 0), rgba(34, 232, 255, 0.8) 70%, #fff); box-shadow: 0 0 24px 6px rgba(34, 232, 255, 0.5); border-radius: 0 0 8px 8px; }
      .mo-rez { inset: auto; width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 18px var(--ll-you), inset 0 0 10px var(--ll-you); }
      .mo-form { position: absolute; inset: 0; overflow: visible; filter: drop-shadow(0 0 5px #22e8ff) drop-shadow(0 0 16px rgba(34, 232, 255, 0.6)); }
      .mo-form .line { fill: none; stroke: #e9fbff; stroke-width: 2.5; stroke-dasharray: 100; stroke-dashoffset: 100; stroke-linejoin: round; }
      .mo-form .fill { fill: rgba(34, 232, 255, 0.35); opacity: 0; }
      .mo-alarm { box-shadow: inset 0 0 90px 26px rgba(255, 46, 126, 0.8); opacity: 0; }
      .mo-tear { inset: auto 0 auto 0; background: rgba(255, 46, 126, 0.16); backdrop-filter: saturate(0) brightness(1.5) contrast(1.3); -webkit-backdrop-filter: saturate(0) brightness(1.5) contrast(1.3); border-top: 1px solid rgba(255, 46, 126, 0.8); border-bottom: 1px solid rgba(34, 232, 255, 0.5); }
      .mo-glitch { inset: auto; left: 50%; top: 40%; font-size: 54px; font-weight: 700; letter-spacing: 0.12em; color: var(--ll-void); text-shadow: 0 0 20px rgba(255, 46, 126, 0.85); white-space: nowrap; }
      .mo-glitch::before, .mo-glitch::after { content: attr(data-text); position: absolute; inset: 0; mix-blend-mode: screen; }
      .mo-glitch::before { color: #22e8ff; animation: mo-jit 0.18s steps(2) infinite; }
      .mo-glitch::after { color: #ff2e2e; animation: mo-jit 0.22s steps(2) infinite reverse; }
      @keyframes mo-jit { 0% { transform: translate(-3px, 1px); clip-path: inset(0 0 55% 0); } 50% { transform: translate(3px, -1px); clip-path: inset(45% 0 0 0); } 100% { transform: translate(-1px, 0); clip-path: inset(20% 0 30% 0); } }
      .mo-glitch-sub { inset: auto 0 auto 0; top: calc(40% + 40px); text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--bone); text-shadow: 0 0 8px rgba(255, 46, 126, 0.9); }

      /* FREEZE */
      .mo-freeze-label { inset: auto; left: 50%; top: 13%; transform: translateX(-50%); display: grid; justify-items: center; white-space: nowrap; }
      .mo-freeze-label b { font-size: 25px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ll-ice); text-shadow: 0 0 16px #6fe3ff, 0 0 40px rgba(111, 227, 255, 0.5); }
      .mo-freeze-label small { margin-top: 3px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(233, 248, 255, 0.8); }
      .mo-stasis { inset: auto; border-radius: 50%; background: rgba(120, 210, 255, 0.06); backdrop-filter: sepia(0.9) hue-rotate(155deg) saturate(1.6) brightness(0.8) contrast(1.15); -webkit-backdrop-filter: sepia(0.9) hue-rotate(155deg) saturate(1.6) brightness(0.8) contrast(1.15); }
      .mo-stasis-rim { position: absolute; inset: auto; border-radius: 50%; border: 3px solid #e6fbff; box-shadow: 0 0 22px 4px #6fe3ff, inset 0 0 30px rgba(111, 227, 255, 0.5); }
      .mo-hex { position: absolute; inset: auto; overflow: visible; filter: drop-shadow(0 0 6px #6fe3ff); }
      .mo-hex polygon { fill: rgba(191, 244, 255, 0.14); stroke: var(--ll-ice); stroke-width: 2; }
      .mo-arrow { inset: auto; height: 0; border-top: 2px dashed rgba(191, 244, 255, 0.85); transform-origin: 0 50%; }
      .mo-arrow::after { content: ''; position: absolute; right: -2px; top: -6px; border: 5px solid transparent; border-left: 8px solid var(--ll-ice); }
      .mo-shard { position: absolute; inset: auto; background: linear-gradient(135deg, #fff, rgba(191, 244, 255, 0.5)); clip-path: polygon(50% 0, 100% 100%, 0 70%); filter: drop-shadow(0 0 6px #6fe3ff); }
      .mo-flash { background: #fff; }

      /* TRANSITION */
      .mo-trans { pointer-events: auto; z-index: 3; }
      .mo-strip { inset: auto 0 auto 0; background: #02050b; }
      .mo-strip.l { box-shadow: 3px 0 0 #22e8ff, 8px 0 18px rgba(34, 232, 255, 0.6); transform-origin: 0 50%; }
      .mo-strip.r { box-shadow: -3px 0 0 #22e8ff, -8px 0 18px rgba(34, 232, 255, 0.6); transform-origin: 100% 50%; }
      .mo-trans.covered .mo-strip { box-shadow: none; }
      .mo-roomnum { inset: auto; left: 50%; top: 46%; display: grid; justify-items: center; }
      .mo-roomnum small { font-size: 16px; font-weight: 700; letter-spacing: 0.5em; margin-bottom: 6px; text-transform: uppercase; color: var(--muted); }
      .mo-digits { position: relative; height: 128px; width: 3.2ch; overflow: hidden; font-size: 128px; }
      .mo-digits b { position: absolute; inset: 0; text-align: center; font-size: 128px; font-weight: 800; line-height: 1; color: #e9fbff; text-shadow: 0 0 14px rgba(34, 232, 255, 0.6); font-variant-numeric: tabular-nums; }
      .mo-digits b.new { opacity: 0; }
      .mo-roomnum em { display: block; margin-top: 16px; font-style: normal; font-size: 16px; font-weight: 700; letter-spacing: 0.18em; line-height: 1.55; text-transform: uppercase; width: min(84vw, 320px); text-align: center; text-wrap: balance; color: var(--ll-hot); text-shadow: 0 0 10px rgba(255, 138, 30, 0.7); }
      .mo-boot { overflow: visible; filter: drop-shadow(0 0 4px #22e8ff) drop-shadow(0 0 14px #22e8ff); }
      .mo-boot path { fill: none; stroke: #bff4ff; stroke-width: 3; stroke-dasharray: 100; stroke-dashoffset: 100; stroke-linejoin: round; }

      .float-text {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform, opacity;
        transform: translate(-50%, -50%);
        font-weight: 700;
        font-size: clamp(13px, 3.6vmin, 22px);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
        pointer-events: none;
        color: var(--bone);
        text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
      }

      .float-text.carom {
        color: #ffe27a;
        font-size: clamp(17px, 5vmin, 30px);
        text-shadow: 0 0 16px rgba(255, 226, 122, 0.85), 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      .float-text.splat {
        color: var(--magenta);
        font-size: clamp(15px, 4.4vmin, 26px);
        text-shadow: 0 0 16px rgba(255, 61, 139, 0.8), 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      .float-text.crit {
        color: var(--amber);
        font-size: clamp(15px, 4.4vmin, 26px);
        text-shadow: 0 0 16px rgba(255, 179, 64, 0.85), 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      /* A CONTACT'S RECEIPT. Small, quiet, and in the cue ball's own hue: it
         says "that counted" without competing with the pocket, which is the
         only thing on this table that gets to shout. */
      .float-text.tick {
        color: var(--cyan);
        font-size: clamp(10px, 2.7vmin, 15px);
        letter-spacing: 0.08em;
        text-shadow: 0 0 10px rgba(34, 232, 255, 0.7), 0 1px 4px rgba(0, 0, 0, 0.9);
      }

      /* The pot's breakdown, stacked under the score it explains. Smaller than
         the figure it belongs to, because it is the receipt and not the event. */
      .float-text.tally {
        color: var(--amber);
        font-size: clamp(11px, 3vmin, 17px);
        letter-spacing: 0.1em;
        text-shadow: 0 0 12px rgba(255, 179, 64, 0.7), 0 1px 4px rgba(0, 0, 0, 0.9);
      }

      .float-text.block {
        color: rgba(234, 246, 255, 0.6);
        font-size: clamp(11px, 3vmin, 17px);
      }

      .float-text.combo {
        color: var(--cyan);
        font-size: clamp(14px, 4vmin, 24px);
        text-shadow: 0 0 14px rgba(34, 232, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      /* Boot / tap-to-start veil. Also unlocks the Web Audio context. */
      #boot-veil {
        position: absolute;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1em;
        text-align: center;
        padding: 8%;
        background:
          radial-gradient(90% 60% at 50% 45%, rgba(34, 232, 255, 0.08) 0%, rgba(2, 5, 11, 0.95) 70%),
          var(--obsidian);
        pointer-events: auto;
        transition: opacity 0.45s ease;
      }

      #boot-veil.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot-veil h1 {
        margin: 0;
        font-size: clamp(26px, 8.5vmin, 54px);
        letter-spacing: 0.18em;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--bone);
        text-shadow:
          0 0 18px rgba(34, 232, 255, 0.65),
          0 0 60px rgba(34, 232, 255, 0.25);
      }

      #boot-veil h2 {
        margin: 0;
        font-size: clamp(11px, 3.1vmin, 17px);
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--cyan);
        opacity: 0.85;
      }

      #boot-veil p {
        margin: 0;
        max-width: 30ch;
        font-size: clamp(11px, 3vmin, 16px);
        line-height: 1.65;
        color: var(--muted);
      }

      #boot-veil .cue {
        margin-top: 0.6em;
        font-size: clamp(12px, 3.4vmin, 18px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--amber);
        animation: cue-pulse 1.6s ease-in-out infinite;
      }

      @keyframes cue-pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }

      #boot-veil .legend {
        display: flex;
        flex-direction: column;
        gap: 0.45em;
        font-size: clamp(10px, 2.7vmin, 14px);
        color: var(--muted);
        letter-spacing: 0.05em;
      }

      #boot-veil .legend b {
        color: var(--bone);
        font-weight: 600;
      }

      /* Rotate hint for landscape phones — the game is portrait-only by design. */
      #rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 10%;
        background: var(--obsidian);
        color: var(--muted);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: clamp(12px, 3.4vmin, 18px);
      }

      @media (orientation: landscape) and (max-height: 460px) {
        #rotate-hint { display: flex; }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-veil .cue { animation: none; opacity: 0.9; }
      }

      /* ---- main menu ---------------------------------------------- */
      /* Dimmed, not opaque: the attract-mode game has to read through it. */
      #boot-veil {
        gap: 0;
        background: radial-gradient(
          ellipse at 50% 42%,
          rgba(5, 7, 10, 0.62) 0%,
          rgba(5, 7, 10, 0.86) 62%,
          rgba(5, 7, 10, 0.95) 100%
        );
        backdrop-filter: blur(1.5px);
      }
      /* Fading to zero opacity leaves the overlay in the layout and the a11y
         tree. Take it out of both once it is dismissed. */
      #boot-veil.hidden {
        visibility: hidden;
        pointer-events: none;
      }
      .menu-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(10px, 2.2vmin, 16px);
        width: min(88%, 340px);
        /* SIZE THE TYPE FROM THIS BOX, NOT FROM THE VIEWPORT.
           There is no webfont: `Rajdhani` is used if the device happens to
           have it and otherwise the stack falls back to Helvetica or Arial,
           which are a good deal wider. A viewport-relative clamp cannot know
           that, so a title that fitted in the test fell off both edges of a
           real phone, and the eyebrow — `white-space: nowrap` — ran off the
           right of the screen. Container units make the question "does this
           fit its box", which is the question. */
        container-type: inline-size;
      }
      /* display:flex above beats the [hidden] attribute's default display:none,
         which silently stacked both panels. Restore it explicitly. */
      .menu-inner[hidden] { display: none; }
      /* Behind the menu the background should read as gameplay, not as a HUD:
         hide the run furniture so only the table and the action show. */
      #ui-layer.attract { opacity: 0; }
      /* THE SUB-HEADLINE, under the name rather than over it — and on one line.
         It sat above the title as an eyebrow and wrapped to two lines on a real
         phone, which is a strapline broken in half above the thing it is a
         strapline for. */
      /* #boot-veil, NOT bare `.menu-eyebrow`. The overlay carries
         `#boot-veil p { font-size: clamp(11px, 3vmin, 16px) }`, an ID selector,
         which quietly outranked every class rule written here — so this text
         was 11.7px on a 390px phone whatever the class said, which is why it
         wrapped and why nothing done to the class fixed it. */
      #boot-veil .menu-eyebrow {
        margin: -2px 0 clamp(6px, 1.6vmin, 12px);
        /* SIZED SO IT FITS ON ONE LINE, measured rather than reasoned about.
           27 characters at this tracking come to roughly 25 ems, so it has to
           stay under a twenty-fifth of the box — and the box is the framed
           stage's, not the screen's.
           Two things make the arithmetic land higher than it looks: the type
           is whatever the device has (there is no webfont), and small text
           gets boosted by about half again on some engines whatever the
           viewport meta says. Both are why this is smaller than it reads: at
           390px it renders at ten and a half and needs 250 of a 288px box. */
        font-size: clamp(8px, 2.6vmin, 12px);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--amber);
        text-align: center;
        /* NOT `nowrap`. It reads as one line on every phone-shaped viewport —
           183px of text in a 236px box at the narrowest — and a box narrower
           than that is a browser window shaped like a letterbox rather than a
           phone. Given the choice between two lines and running off the side
           of the screen, two lines. */
        max-width: 100%;
      }
      @supports (container-type: inline-size) {
        #boot-veil .menu-eyebrow { font-size: min(3.2cqw, 12px); }
      }
      .menu-title {
        max-width: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        line-height: 0.92;
        text-align: center;
      }
      .menu-title .ln {
        /* ROGUELIKE is nine characters; in the widest font this stack can fall
           back to that is about seven ems, so a seventh of the box is the size
           that fits whatever the device has installed. The vmin rule is the
           fallback for a browser without container queries — an unsupported
           `cqw` takes the whole declaration with it. */
        font-size: clamp(30px, 11vmin, 60px);
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        /* Neon sweep: a highlight travels the letterforms like light down a rail. */
        background: linear-gradient(100deg,
          var(--cyan) 0%, var(--bone) 34%, var(--cyan) 52%, #1a8ea3 78%, var(--cyan) 100%);
        background-size: 260% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: menu-sweep 5.5s linear infinite;
        filter: drop-shadow(0 0 22px rgba(34, 232, 255, 0.35));
      }
      @supports (container-type: inline-size) {
        .menu-title .ln { font-size: min(13.5cqw, 68px); }
      }
      .menu-title .ln:nth-child(2) { animation-delay: -2.75s; }
      @keyframes menu-sweep {
        from { background-position: 0% 0; }
        to   { background-position: -260% 0; }
      }
      .menu-sub {
        margin: 0 0 6px;
        font-size: clamp(15px, 4.2vmin, 22px);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--bone);
      }
      .menu-btn {
        width: 100%;
        padding: clamp(11px, 2.8vmin, 15px) 18px;
        border-radius: 10px;
        border: 1px solid rgba(34, 232, 255, 0.4);
        background: rgba(13, 29, 45, 0.7);
        color: var(--bone);
        font-family: var(--font);
        font-size: clamp(12px, 3vmin, 15px);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        pointer-events: auto;
        transition: transform 0.12s ease, background 0.14s ease, border-color 0.14s ease;
      }
      .menu-btn:hover { background: rgba(34, 232, 255, 0.14); border-color: var(--cyan); }
      .menu-btn:active { transform: scale(0.98); }
      .menu-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
      .menu-btn.primary {
        background: var(--cyan);
        border-color: var(--cyan);
        color: #04231f;
        box-shadow: 0 0 26px rgba(34, 232, 255, 0.4);
      }
      .menu-btn.primary:hover { background: #7ff8ff; }
      /* THREE EQUAL COLUMNS, AND NONE OF THEM CAN PUSH THE ROW WIDER.
         This was a flex row of `.menu-btn`s, each carrying `width: 100%` from
         the base rule. A flex item will not shrink below its min-content width
         by default, so three buttons each asking for the full row — one of
         them holding the unbreakable word SETTINGS — could not fit and spilled
         out of the right-hand side. Measured on a 360px phone the row's own box
         was centred and its contents ran 50px past it, putting SOUND ON off the
         edge of the screen. `minmax(0, 1fr)` is the grid spelling of "you may
         be narrower than your contents want". */
      .menu-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        width: 100%;
      }
      .menu-row .menu-btn {
        width: auto;
        min-width: 0;
        padding-inline: 4px;
        font-size: clamp(10px, 2.6vmin, 13px);
        letter-spacing: 0.08em;
        /* One box, three equal heights: SOUND ON wraps to two lines and the
           other two must not become shorter buttons beside it. */
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .menu-foot {
        margin: 4px 0 0;
        font-size: clamp(9px, 2.3vmin, 11px);
        letter-spacing: 0.1em;
        color: var(--muted);
        text-align: center;
      }

      /* ---- tutorial coach ----------------------------------------- */
      /* Centred and large on purpose: the instruction is the most important
         thing on screen while it is up, and a small strip at the bottom was
         competing with the table for attention and losing. */
      /* THE SPOTLIGHT.
         A pop-up that names a thing on the table is only half an instruction —
         the player still has to find the thing. Dimming everything except a
         circle around it turns "the red bar is the goal" into a pointer. The
         cutout is a radial gradient mask so it feathers rather than cutting a
         hard hole in the felt. */
      #coach-spot {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
        z-index: 30;
        /* The ending shape is twice the spotlight's half-extents, so the stops
           read as halves of it: clear out to the shape, then as much again of
           feather. Feathering over a fixed fraction of the SCREEN instead put
           the whole table at full dim a few pixels outside the ring, on a scene
           that is already nearly black — the felt stopped existing rather than
           receding. */
        background: radial-gradient(
          ellipse calc(var(--spot-rx, 90px) * 2) calc(var(--spot-ry, 90px) * 2)
            at var(--spot-x, 50%) var(--spot-y, 50%),
          rgba(5, 7, 10, 0) 0%,
          rgba(5, 7, 10, 0) 50%,
          rgba(5, 7, 10, 0.52) 100%
        );
      }
      #coach-spot.show { opacity: 1; }

      /* A ring on the spotlit thing, so it reads as "this one" and not just as
         a brighter patch of table. */
      #coach-ring {
        position: absolute;
        left: var(--spot-x, 50%);
        top: var(--spot-y, 50%);
        width: calc(var(--spot-rx, 90px) * 2);
        height: calc(var(--spot-ry, 90px) * 2);
        margin-left: calc(var(--spot-rx, 90px) * -1);
        margin-top: calc(var(--spot-ry, 90px) * -1);
        /* A capsule, not a circle: it has to hug a wide flat goal bar and a
           tall narrow rack with the same rule. */
        border-radius: 999px;
        /* Dashed and faint on purpose. A solid white capsule reads as an OBJECT
           on the felt and competes with the called pocket, which is the one
           thing on screen allowed to be bright white. This is a region marker:
           it says "the sentence is about what's in here", nothing more. */
        border: 1.5px dashed rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 14px rgba(255, 255, 255, 0.09);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
        z-index: 31;
      }
      /* The animation is attached ONLY in the shown state. Declared on the base
         rule it kept setting `opacity` every frame, and a running animation
         outranks the plain `opacity: 0` above it — so the ring stayed on screen
         after its lesson was over, floating over a finished table. */
      #coach-ring.show {
        opacity: 1;
        animation: spot-pulse 1.9s ease-in-out infinite;
      }
      @keyframes spot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.72; }
      }

      /* THE GHOST HAND.
         A card can name the gesture; only a demonstration teaches it. This is a
         finger that presses behind the ball, draws back along the cue's own
         axis to the distance that means full power, and releases — on a loop,
         until the player does it themselves.
         Both ends are projected from world space by Tutorial._updateHand, so the
         path is the actual draw corridor rather than a guess at one. */
      #coach-hand-track {
        position: absolute;
        left: var(--hand-x, 50%);
        top: var(--hand-y, 50%);
        width: var(--hand-len, 0px);
        height: 3px;
        margin-top: -1.5px;
        transform-origin: 0 50%;
        transform: rotate(var(--hand-rot, 0deg));
        border-radius: 2px;
        background: linear-gradient(
          to right,
          rgba(255, 255, 255, 0.06),
          rgba(255, 255, 255, 0.42)
        );
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 32;
      }
      #coach-hand-track.show { opacity: 1; }

      #coach-hand {
        position: absolute;
        left: var(--hand-x, 50%);
        top: var(--hand-y, 50%);
        width: 46px;
        height: 46px;
        margin-left: -23px;
        margin-top: -23px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.92);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.4) 0%,
          rgba(255, 255, 255, 0.14) 55%,
          rgba(255, 255, 255, 0) 72%
        );
        box-shadow: 0 0 18px rgba(255, 255, 255, 0.5);
        opacity: 0;
        pointer-events: none;
        z-index: 33;
      }
      /* Animation lives in the shown state only — the ring above taught us why. */
      #coach-hand.show {
        animation: hand-draw 2.6s cubic-bezier(0.33, 0, 0.3, 1) infinite;
      }
      @keyframes hand-draw {
        0%   { opacity: 0; transform: translate(0, 0) scale(1.35); }
        10%  { opacity: 1; transform: translate(0, 0) scale(1); }
        18%  { opacity: 1; transform: translate(0, 0) scale(0.88); }
        58%  { opacity: 1; transform: translate(var(--hand-dx, 0px), var(--hand-dy, 0px)) scale(0.88); }
        70%  { opacity: 1; transform: translate(var(--hand-dx, 0px), var(--hand-dy, 0px)) scale(0.88); }
        78%  { opacity: 0.9; transform: translate(var(--hand-dx, 0px), var(--hand-dy, 0px)) scale(1.6); }
        88%  { opacity: 0; transform: translate(var(--hand-dx, 0px), var(--hand-dy, 0px)) scale(1.8); }
        100% { opacity: 0; transform: translate(0, 0) scale(1.35); }
      }

      /* ---- modes ---------------------------------------------------- *
         A mode is a whole design, so it gets a card rather than a row in a
         list: the name alone ("Classic") tells a player nothing about what
         they would be choosing, and the difference between these two is the
         entire game. The card the player is already in is marked and inert —
         it is there to say what they have, not to be pressed.               */
      .mode-card {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 12px 14px;
        text-align: left;
        text-decoration: none;
        font-family: inherit;
        border-radius: 12px;
        border: 1px solid rgba(234, 246, 255, 0.14);
        background: rgba(234, 246, 255, 0.04);
        cursor: pointer;
      }
