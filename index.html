<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305070a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2335f2ff'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23d9feff'/%3E%3C/svg%3E"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Billiard Roguelike — real-time kinetic billiards meets boon-stacking action roguelike."
    />
    <title>Billiard Roguelike</title>
    <style>
      /* ---------------------------------------------------------------
         Dark Velvet Cyber-Billiards — shell styling.
         The game itself renders into #stage-canvas; every readable UI
         element is DOM so text stays crisp on high-DPI phones.
         --------------------------------------------------------------- */
      :root {
        --obsidian: #05070a;
        --felt-deep: #06231d;
        --felt: #0b3a2e;
        --cyan: #35f2ff;
        --magenta: #ff3d8b;
        --amber: #ffb340;
        --violet: #a05cff;
        --bone: #eaf6ff;
        --muted: rgba(234, 246, 255, 0.55);
        --hud-pad: clamp(10px, 3.2vmin, 20px);
        --font: 'Rajdhani', 'Chakra Petch', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--bone);
        font-family: var(--font);
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Letterbox host: fills the viewport, centers the 9:16 stage. */
      #shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(120% 80% at 50% 0%, #0a1016 0%, #05070a 55%, #000 100%);
      }

      /* The fixed 9:16 portrait stage. JS sizes it precisely; the CSS here is
         the pre-boot fallback so the first paint is already the right shape. */
      #stage {
        position: relative;
        aspect-ratio: 9 / 16;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
        border-radius: clamp(0px, 1.6vmin, 14px);
        box-shadow:
          0 0 0 1px rgba(53, 242, 255, 0.16),
          0 0 60px rgba(53, 242, 255, 0.07),
          0 24px 80px rgba(0, 0, 0, 0.85);
        background: var(--obsidian);
        touch-action: none;
      }

      #stage-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* All HUD / modal DOM lives here. Children opt back into pointer events. */
      #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        font-family: var(--font);
      }

      /* ---------------- HUD ---------------- */
      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .hud-label {
        font-size: clamp(8px, 2.1vmin, 11px);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.35em;
      }

      /* The corner pockets sit exactly where the HUD's corners do — that is
         what a 9:16 table with pockets at its corners means — so the top band
         gets a scrim of its own rather than fighting a glowing rim for
         legibility. */
      .hud-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: var(--hud-pad) var(--hud-pad) calc(var(--hud-pad) * 0.9);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        background: linear-gradient(to bottom, rgba(5, 7, 10, 0.82) 0%, rgba(5, 7, 10, 0.55) 60%, transparent 100%);
      }

      .hud-hp {
        flex: 1 1 42%;
        min-width: 0;
      }

      .hp-bar {
        position: relative;
        height: clamp(7px, 1.8vmin, 11px);
        border-radius: 999px;
        background: rgba(234, 246, 255, 0.1);
        box-shadow: inset 0 0 0 1px rgba(53, 242, 255, 0.18);
        overflow: hidden;
      }

      .hp-ghost,
      .hp-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 999px;
        width: 100%;
      }

      .hp-ghost {
        background: rgba(255, 61, 139, 0.45);
      }

      .hp-fill {
        background: linear-gradient(90deg, #35f2ff 0%, #7dfbe0 100%);
        box-shadow: 0 0 12px rgba(53, 242, 255, 0.65);
        transition: width 0.12s linear;
      }

      .hp-fill.critical {
        background: linear-gradient(90deg, #ff3d8b 0%, #ffb340 100%);
        box-shadow: 0 0 14px rgba(255, 61, 139, 0.8);
      }

      .hp-text {
        margin-top: 0.4em;
        font-size: clamp(9px, 2.3vmin, 12px);
        letter-spacing: 0.14em;
        color: var(--muted);
      }

      /* THE CONTRACT.
         The one thing on screen that says what winning means, written as a
         sentence. It sits dead centre of the top band because that is where
         the eye lands between strokes. */
      .hud-contract {
        flex: 1 1 44%;
        text-align: center;
        min-width: 0;
      }

      .contract-text {
        font-size: clamp(11px, 3.1vmin, 16px);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0.1em;
        color: var(--bone);
        text-shadow: 0 0 16px rgba(53, 242, 255, 0.45);
      }
      .contract-text.done {
        color: #2ef2c4;
        text-shadow: 0 0 16px rgba(46, 242, 196, 0.6);
      }

      .contract-pips {
        margin-top: 0.45em;
        display: flex;
        gap: 3px;
        justify-content: center;
      }
      .contract-pips .pip {
        width: clamp(9px, 2.6vmin, 14px);
        height: 3px;
        border-radius: 2px;
        background: rgba(53, 242, 255, 0.22);
        transition: background 0.18s ease;
      }
      .contract-pips .pip.on {
        background: var(--cyan);
        box-shadow: 0 0 8px rgba(53, 242, 255, 0.8);
      }

      .hud-score {
        flex: 0 0 auto;
        text-align: right;
        min-width: 0;
      }
      .score-value {
        font-size: clamp(17px, 5vmin, 28px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.02em;
        color: var(--bone);
      }

      /* Owned-boon chips */
      .hud-build {
        position: absolute;
        top: calc(var(--hud-pad) + clamp(52px, 12vmin, 76px));
        left: var(--hud-pad);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        max-width: 46%;
      }

      .build-chip {
        display: flex;
        align-items: center;
        gap: 0.45em;
        padding: 0.22em 0.6em;
        border-radius: 999px;
        font-size: clamp(8px, 2.1vmin, 11px);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: rgba(5, 7, 10, 0.66);
        border: 1px solid rgba(234, 246, 255, 0.22);
        color: rgba(234, 246, 255, 0.9);
        backdrop-filter: blur(2px);
      }

      .build-chip.rare {
        border-color: rgba(53, 242, 255, 0.75);
        box-shadow: 0 0 10px rgba(53, 242, 255, 0.25);
      }

      .build-chip.epic {
        border-color: rgba(255, 61, 139, 0.8);
        box-shadow: 0 0 12px rgba(255, 61, 139, 0.3);
      }

      .chip-glyph {
        font-size: 1.15em;
        line-height: 1;
      }

      .build-chip.phase-launch .chip-glyph { color: var(--amber); }
      .build-chip.phase-trajectory .chip-glyph { color: var(--cyan); }
      .build-chip.phase-impact .chip-glyph { color: var(--magenta); }
      .build-chip.phase-rebound .chip-glyph { color: var(--violet); }

      .chip-rank {
        color: var(--amber);
        font-weight: 700;
      }

      /* Combo counter */
      /* THE SCOREBOARD. This is the only running read on how well the shot is
         going, and it used to be two lines of unbacked text over the felt —
         legible against dark table, invisible against a bloom. It is a pill
         now, with the chain's own countdown drawn under it. */
      .hud-combo {
        position: absolute;
        right: var(--hud-pad);
        top: 40%;
        text-align: right;
        padding: 7px 12px 9px;
        border-radius: 12px;
        background: rgba(5, 7, 10, 0.62);
        border: 1px solid rgba(53, 242, 255, 0.35);
        box-shadow: 0 0 24px rgba(53, 242, 255, 0.18);
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      .hud-combo.visible {
        opacity: 1;
      }

      .combo-mult {
        font-size: clamp(24px, 8vmin, 46px);
        font-weight: 700;
        line-height: 0.95;
        color: var(--cyan);
        text-shadow: 0 0 20px rgba(53, 242, 255, 0.75);
      }

      .combo-count {
        font-size: clamp(10px, 2.7vmin, 14px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.92);
      }

      /* The chain window, draining. Anchored right so it empties toward the
         edge the numbers are already aligned to. */
      .combo-bar {
        margin-top: 6px;
        height: 3px;
        border-radius: 2px;
        background: rgba(234, 246, 255, 0.16);
        overflow: hidden;
      }
      .combo-fill {
        height: 100%;
        border-radius: 2px;
        background: var(--cyan);
        transform-origin: right center;
        transform: scaleX(1);
        box-shadow: 0 0 10px rgba(53, 242, 255, 0.8);
      }

      .hud-combo.pop .combo-mult {
        animation: combo-pop 0.22s ease-out;
      }

      @keyframes combo-pop {
        0% { transform: scale(1.45); }
        100% { transform: scale(1); }
      }

      /* A lesson has no contract, no stroke budget and no way to be hurt, so
         every one of these would be stating a number nothing is enforcing.
         They fade in together with the first real room.

         The hull bar joins them for a second reason as well: the table is
         framed edge to edge, so the two far corner pockets sit UNDER this
         band, and two of the six boards call one of them. A board that lights
         a pocket to say "there" and then covers it has not pointed at
         anything. With the readouts gone the corners are clear felt. */
      #ui-layer.coaching .hud-contract,
      #ui-layer.coaching .hud-strokes,
      #ui-layer.coaching .hud-score,
      #ui-layer.coaching .hud-hp,
      #ui-layer.coaching .hud-freeze {
        opacity: 0;
        pointer-events: none;
      }
      .hud-contract, .hud-strokes, .hud-score, .hud-hp {
        transition: opacity 0.45s ease;
      }

      /* THE BUDGET, AS COUNTABLE MARKS.
         A number you have to read is a number that does not get read mid-shot.
         Lit cues are strokes you still have; dark ones are strokes you spent. */
      .hud-strokes {
        position: absolute;
        bottom: calc(var(--hud-pad) + 2px);
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 10px;
        background: rgba(5, 7, 10, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .stroke-row {
        display: flex;
        gap: clamp(4px, 1.3vmin, 7px);
        align-items: flex-end;
      }
      .stroke-row .cue {
        width: clamp(4px, 1.2vmin, 6px);
        height: clamp(18px, 5vmin, 28px);
        border-radius: 3px;
        background: var(--amber);
        box-shadow: 0 0 10px rgba(255, 179, 64, 0.55);
        transition: background 0.2s ease, box-shadow 0.2s ease;
      }
      .stroke-row .cue.spent {
        background: rgba(255, 179, 64, 0.16);
        box-shadow: none;
      }
      .stroke-row.last .cue:not(.spent) {
        background: var(--magenta);
        box-shadow: 0 0 14px rgba(255, 61, 139, 0.8);
        animation: cue-pulse 0.9s ease-in-out infinite;
      }

      .stroke-text {
        font-size: clamp(7px, 1.9vmin, 10px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Freeze charges. Diamonds, because freeze is the one power that stops
         the table, and nothing else on the HUD is a diamond. */
      .hud-freeze {
        position: absolute;
        bottom: calc(var(--hud-pad) + 2px);
        right: var(--hud-pad);
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(5, 7, 10, 0.6);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        opacity: 0.4;
        transition: opacity 0.3s ease;
      }
      .hud.has-freeze .hud-freeze { opacity: 1; }

      .freeze-row { display: flex; gap: 5px; }
      .freeze-row .frz {
        width: clamp(8px, 2.2vmin, 11px);
        height: clamp(8px, 2.2vmin, 11px);
        transform: rotate(45deg);
        border: 1.5px solid rgba(53, 242, 255, 0.32);
      }
      .freeze-row .frz.on {
        background: var(--cyan);
        border-color: var(--cyan);
        box-shadow: 0 0 10px rgba(53, 242, 255, 0.8);
      }

      /* THE SCORECARD. The moment the economy becomes legible: what the pots
         paid, and what the strokes you did not spend were worth. */
      .hud-card {
        position: absolute;
        left: 50%;
        top: 33%;
        transform: translate(-50%, -12px);
        width: min(78%, 330px);
        padding: 14px 16px 15px;
        border-radius: 8px;
        background: rgba(5, 7, 10, 0.93);
        border: 1px solid rgba(53, 242, 255, 0.34);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }
      .hud-card.visible {
        opacity: 1;
        transform: translate(-50%, 0);
        /* The card carries the exit buttons now, so it has to take taps. */
        pointer-events: auto;
      }

      .card-head { margin-bottom: 10px; }
      .card-status {
        font-size: clamp(8px, 2.1vmin, 11px);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #2ef2c4;
      }
      .card-status.failed { color: var(--hazard, #ff5a3d); }
      .card-title {
        margin-top: 2px;
        font-size: clamp(14px, 4vmin, 20px);
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--bone);
      }

      .card-line, .card-total {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        align-items: baseline;
        padding: 4px 0;
        border-bottom: 1px solid rgba(234, 246, 255, 0.08);
      }
      .card-line .card-k {
        font-size: clamp(9px, 2.4vmin, 12px);
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.62);
      }
      .card-line .card-d {
        font-size: clamp(8px, 2vmin, 10px);
        color: rgba(234, 246, 255, 0.35);
      }
      .card-line .card-v {
        font-size: clamp(11px, 2.9vmin, 14px);
        font-weight: 700;
        color: var(--bone);
      }
      .card-line.hero .card-k, .card-line.hero .card-v { color: var(--amber); }
      .card-line.bad .card-v { color: #ff5a3d; }

      .card-totals { margin-top: 8px; }
      .card-total {
        grid-template-columns: 1fr auto;
        border-bottom: 0;
        padding: 3px 0;
      }
      .card-total .card-k {
        font-size: clamp(8px, 2.1vmin, 10px);
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.5);
      }
      .card-total .card-v {
        font-size: clamp(15px, 4.4vmin, 22px);
        font-weight: 700;
        color: var(--bone);
      }
      .card-total.run .card-v { color: var(--cyan); }

      .card-prompt {
        margin-top: 11px;
        padding-top: 9px;
        border-top: 1px solid rgba(234, 246, 255, 0.1);
        text-align: center;
        font-size: clamp(8px, 2.1vmin, 11px);
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.6);
      }

      /* THE EXIT BUTTONS. One per reward, stacked under the totals, each in
         its own reward colour. A tap, not a trick shot. */
      .card-choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
      }
      .card-choice {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 11px 14px;
        border-radius: 8px;
        border: 1px solid var(--c, #7df9ff);
        background: color-mix(in srgb, var(--c, #7df9ff) 12%, transparent);
        font-family: inherit;
        cursor: pointer;
        pointer-events: auto;
        text-align: left;
        transition: background 0.15s ease, transform 0.12s ease;
      }
      .card-choice:hover { background: color-mix(in srgb, var(--c, #7df9ff) 22%, transparent); }
      .card-choice:active { transform: scale(0.985); }
      .card-choice .choice-name {
        font-size: clamp(12px, 3.4vmin, 16px);
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--c, #7df9ff);
      }
      .card-choice .choice-detail {
        font-size: clamp(9px, 2.4vmin, 12px);
        font-weight: 600;
        color: rgba(234, 246, 255, 0.7);
        text-align: right;
      }


      /* THE FLOATING AIM PAD.
         Drawn under the thumb, carrying the cue's geometry: the ring is a full
         draw, the knob is the butt, and the line between them is the shot. It
         has to be legible over dark felt without competing with the trajectory
         preview, so it is bone-white at low alpha and entirely unfilled except
         for the power arc. */
      .aim-pad {
        position: absolute;
        left: var(--pad-x, 50%);
        top: var(--pad-y, 50%);
        width: 0;
        height: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.14s ease;
        z-index: 26;
      }
      .aim-pad.show { opacity: 1; }
      .pad-ring,
      .pad-fill {
        position: absolute;
        left: 0;
        top: 0;
        width: calc(var(--pad-r, 90px) * 2);
        height: calc(var(--pad-r, 90px) * 2);
        margin-left: calc(var(--pad-r, 90px) * -1);
        margin-top: calc(var(--pad-r, 90px) * -1);
        border-radius: 50%;
      }
      .pad-ring {
        border: 1.5px solid rgba(234, 246, 255, 0.22);
        box-shadow: inset 0 0 24px rgba(53, 242, 255, 0.06);
      }
      /* The power read, as a disc that grows to fill the ring. Radius, not
         colour: the palette's channels are all spoken for. */
      .pad-fill {
        transform: scale(var(--pad-power, 0));
        background: radial-gradient(
          circle,
          rgba(53, 242, 255, 0.14) 0%,
          rgba(53, 242, 255, 0.05) 70%,
          transparent 100%
        );
        border: 1px solid rgba(53, 242, 255, 0.3);
      }
      .pad-line {
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        width: var(--line-len, 0px);
        margin-top: -1px;
        transform-origin: 0 50%;
        transform: rotate(var(--line-rot, 0deg));
        background: linear-gradient(
          90deg,
          rgba(53, 242, 255, 0.75),
          rgba(53, 242, 255, 0.25)
        );
      }
      .pad-knob {
        position: absolute;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        transform: translate(var(--knob-x, 0px), var(--knob-y, 0px));
        border: 2px solid rgba(234, 246, 255, 0.65);
        background: rgba(5, 7, 10, 0.35);
        box-shadow: 0 0 16px rgba(53, 242, 255, 0.35);
      }

      /* Banner */
      /* Long banner subs ran edge to edge and wrapped badly, clipping letters
         at both margins. */
      .hud-banner { padding-inline: 20px; }
      .banner-sub { max-width: 88%; margin-inline: auto; }
      .banner-hint {
        margin-top: 14px;
        font-size: clamp(8px, 2.1vmin, 11px);
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(234, 246, 255, 0.4);
      }

      .hud-banner {
        position: absolute;
        top: 34%;
        left: 0;
        right: 0;
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .hud-banner.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .banner-title {
        font-size: clamp(19px, 6.4vmin, 38px);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--bone);
        text-shadow: 0 0 22px rgba(53, 242, 255, 0.7);
      }

      .banner-sub {
        margin-top: 0.4em;
        font-size: clamp(10px, 2.8vmin, 15px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--amber);
      }

      /* World-projected exit-door reward labels */
      .hud-doors {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .door-label {
        position: absolute;
        left: 0;
        top: 0;
        padding: 0.28em 0.7em;
        border: 1px solid currentColor;
        border-radius: 999px;
        background: rgba(5, 7, 10, 0.72);
        font-size: clamp(9px, 2.4vmin, 13px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
        box-shadow: 0 0 14px rgba(0, 0, 0, 0.7);
      }

      /* Damage vignette */
      .hud-damage {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(
          120% 90% at 50% 50%,
          rgba(255, 61, 139, 0) 45%,
          rgba(255, 61, 139, 0.75) 100%
        );
      }

      /* ---------------- Boon modal ---------------- */
      .boon-scrim {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 5%;
        background: rgba(5, 7, 10, 0.86);
        backdrop-filter: blur(4px);
        pointer-events: auto;
      }

      .boon-scrim.visible {
        display: flex;
        animation: fade-in 0.22s ease;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .boon-panel {
        width: 100%;
        max-width: 460px;
        text-align: center;
      }

      .boon-title {
        font-size: clamp(17px, 5.4vmin, 30px);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--bone);
        text-shadow: 0 0 18px rgba(53, 242, 255, 0.55);
      }

      .boon-subtitle {
        margin-top: 0.35em;
        font-size: clamp(9px, 2.5vmin, 13px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--amber);
      }

      .boon-cards {
        margin-top: clamp(12px, 3.5vmin, 24px);
        display: flex;
        flex-direction: column;
        gap: clamp(8px, 2.2vmin, 14px);
      }

      .boon-card {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        padding: clamp(10px, 2.8vmin, 16px);
        border-radius: 12px;
        border: 1px solid rgba(234, 246, 255, 0.28);
        background: linear-gradient(160deg, rgba(11, 58, 46, 0.7) 0%, rgba(5, 7, 10, 0.9) 70%);
        color: var(--bone);
        font-family: var(--font);
        cursor: pointer;
        pointer-events: auto;
        transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      }

      .boon-card:active {
        transform: scale(0.985);
      }

      .boon-card.rare {
        border-color: rgba(53, 242, 255, 0.7);
        box-shadow: 0 0 18px rgba(53, 242, 255, 0.2);
      }

      .boon-card.epic {
        border-color: rgba(255, 61, 139, 0.85);
        box-shadow: 0 0 22px rgba(255, 61, 139, 0.28);
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: clamp(8px, 2.1vmin, 11px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      /*
       * Card hierarchy, largest to smallest: what it DOES, then the numbers,
       * then when it fires, then its name. The name used to lead and it is the
       * one line that cannot help you choose — "Chain Arc" means nothing until
       * you already own it.
       */
      .card-trigger { color: var(--cyan); }
      .boon-card.phase-launch .card-trigger { color: var(--amber); }
      .boon-card.phase-impact .card-trigger { color: var(--magenta); }
      .boon-card.phase-rebound .card-trigger { color: var(--violet); }
      .card-rarity { color: var(--muted); }

      .card-effect {
        margin-top: 0.34em;
        font-size: clamp(15px, 4.3vmin, 23px);
        font-weight: 700;
        line-height: 1.24;
        letter-spacing: 0.005em;
        color: var(--bone);
        max-width: 84%;
        text-wrap: balance;
      }

      .card-numbers {
        margin-top: 0.42em;
        font-size: clamp(11px, 3vmin, 15px);
        font-weight: 600;
        letter-spacing: 0.03em;
        color: var(--cyan);
        max-width: 88%;
        font-variant-numeric: tabular-nums;
      }
      .boon-card.phase-launch .card-numbers { color: var(--amber); }
      .boon-card.phase-impact .card-numbers { color: var(--magenta); }
      .boon-card.phase-rebound .card-numbers { color: var(--violet); }

      .card-foot {
        margin-top: 0.7em;
        display: flex;
        align-items: center;
        gap: 0.5em;
        font-size: clamp(8px, 2.2vmin, 11px);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .card-glyph {
        font-size: 1.5em;
        line-height: 1;
        opacity: 0.75;
      }

      .card-rank {
        margin-left: auto;
        color: var(--amber);
        letter-spacing: 0.14em;
      }

      .boon-empty {
        padding: 2em 1em;
        color: var(--muted);
        letter-spacing: 0.12em;
      }

      .boon-footer {
        margin-top: clamp(10px, 2.6vmin, 18px);
        font-size: clamp(9px, 2.3vmin, 12px);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* World-space floating combat text, projected from the scene each frame. */
      .float-text {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform, opacity;
        transform: translate(-50%, -50%);
        font-weight: 700;
        font-size: clamp(13px, 3.6vmin, 22px);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
        pointer-events: none;
        color: var(--bone);
        text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
      }

      .float-text.carom {
        color: #ffe27a;
        font-size: clamp(17px, 5vmin, 30px);
        text-shadow: 0 0 16px rgba(255, 226, 122, 0.85), 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      .float-text.splat {
        color: var(--magenta);
        font-size: clamp(15px, 4.4vmin, 26px);
        text-shadow: 0 0 16px rgba(255, 61, 139, 0.8), 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      .float-text.crit {
        color: var(--amber);
        font-size: clamp(15px, 4.4vmin, 26px);
        text-shadow: 0 0 16px rgba(255, 179, 64, 0.85), 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      .float-text.block {
        color: rgba(234, 246, 255, 0.6);
        font-size: clamp(11px, 3vmin, 17px);
      }

      .float-text.combo {
        color: var(--cyan);
        font-size: clamp(14px, 4vmin, 24px);
        text-shadow: 0 0 14px rgba(53, 242, 255, 0.8), 0 2px 6px rgba(0, 0, 0, 0.9);
      }

      /* Boot / tap-to-start veil. Also unlocks the Web Audio context. */
      #boot-veil {
        position: absolute;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1em;
        text-align: center;
        padding: 8%;
        background:
          radial-gradient(90% 60% at 50% 45%, rgba(11, 58, 46, 0.55) 0%, rgba(5, 7, 10, 0.94) 70%),
          var(--obsidian);
        pointer-events: auto;
        transition: opacity 0.45s ease;
      }

      #boot-veil.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot-veil h1 {
        margin: 0;
        font-size: clamp(26px, 8.5vmin, 54px);
        letter-spacing: 0.18em;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--bone);
        text-shadow:
          0 0 18px rgba(53, 242, 255, 0.65),
          0 0 60px rgba(53, 242, 255, 0.25);
      }

      #boot-veil h2 {
        margin: 0;
        font-size: clamp(11px, 3.1vmin, 17px);
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--cyan);
        opacity: 0.85;
      }

      #boot-veil p {
        margin: 0;
        max-width: 30ch;
        font-size: clamp(11px, 3vmin, 16px);
        line-height: 1.65;
        color: var(--muted);
      }

      #boot-veil .cue {
        margin-top: 0.6em;
        font-size: clamp(12px, 3.4vmin, 18px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--amber);
        animation: cue-pulse 1.6s ease-in-out infinite;
      }

      @keyframes cue-pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }

      #boot-veil .legend {
        display: flex;
        flex-direction: column;
        gap: 0.45em;
        font-size: clamp(10px, 2.7vmin, 14px);
        color: var(--muted);
        letter-spacing: 0.05em;
      }

      #boot-veil .legend b {
        color: var(--bone);
        font-weight: 600;
      }

      /* Rotate hint for landscape phones — the game is portrait-only by design. */
      #rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 10%;
        background: var(--obsidian);
        color: var(--muted);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: clamp(12px, 3.4vmin, 18px);
      }

      @media (orientation: landscape) and (max-height: 460px) {
        #rotate-hint { display: flex; }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-veil .cue { animation: none; opacity: 0.9; }
      }

      /* ---- main menu ---------------------------------------------- */
      /* Dimmed, not opaque: the attract-mode game has to read through it. */
      #boot-veil {
        gap: 0;
        background: radial-gradient(
          ellipse at 50% 42%,
          rgba(5, 7, 10, 0.62) 0%,
          rgba(5, 7, 10, 0.86) 62%,
          rgba(5, 7, 10, 0.95) 100%
        );
        backdrop-filter: blur(1.5px);
      }
      /* Fading to zero opacity leaves the overlay in the layout and the a11y
         tree. Take it out of both once it is dismissed. */
      #boot-veil.hidden {
        visibility: hidden;
        pointer-events: none;
      }
      .menu-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(10px, 2.2vmin, 16px);
        width: min(88%, 340px);
      }
      /* display:flex above beats the [hidden] attribute's default display:none,
         which silently stacked both panels. Restore it explicitly. */
      .menu-inner[hidden] { display: none; }
      /* Behind the menu the background should read as gameplay, not as a HUD:
         hide the run furniture so only the table and the action show. */
      #ui-layer.attract { opacity: 0; }
      .menu-eyebrow {
        margin: 0;
        font-size: clamp(9px, 2.4vmin, 12px);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--amber);
        white-space: nowrap;
      }
      .menu-title {
        margin: 0 0 clamp(8px, 2vmin, 18px);
        display: flex;
        flex-direction: column;
        line-height: 0.92;
        text-align: center;
      }
      .menu-title .ln {
        font-size: clamp(38px, 12vmin, 68px);
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        /* Neon sweep: a highlight travels the letterforms like light down a rail. */
        background: linear-gradient(100deg,
          var(--cyan) 0%, var(--bone) 34%, var(--cyan) 52%, #1a8ea3 78%, var(--cyan) 100%);
        background-size: 260% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: menu-sweep 5.5s linear infinite;
        filter: drop-shadow(0 0 22px rgba(53, 242, 255, 0.35));
      }
      .menu-title .ln:nth-child(2) { animation-delay: -2.75s; }
      @keyframes menu-sweep {
        from { background-position: 0% 0; }
        to   { background-position: -260% 0; }
      }
      .menu-sub {
        margin: 0 0 6px;
        font-size: clamp(15px, 4.2vmin, 22px);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--bone);
      }
      .menu-btn {
        width: 100%;
        padding: clamp(11px, 2.8vmin, 15px) 18px;
        border-radius: 10px;
        border: 1px solid rgba(53, 242, 255, 0.4);
        background: rgba(11, 58, 46, 0.5);
        color: var(--bone);
        font-family: var(--font);
        font-size: clamp(12px, 3vmin, 15px);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        pointer-events: auto;
        transition: transform 0.12s ease, background 0.14s ease, border-color 0.14s ease;
      }
      .menu-btn:hover { background: rgba(53, 242, 255, 0.14); border-color: var(--cyan); }
      .menu-btn:active { transform: scale(0.98); }
      .menu-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
      .menu-btn.primary {
        background: var(--cyan);
        border-color: var(--cyan);
        color: #04231f;
        box-shadow: 0 0 26px rgba(53, 242, 255, 0.4);
      }
      .menu-btn.primary:hover { background: #7ff8ff; }
      .menu-row { display: flex; gap: 10px; width: 100%; }
      .menu-foot {
        margin: 4px 0 0;
        font-size: clamp(9px, 2.3vmin, 11px);
        letter-spacing: 0.1em;
        color: var(--muted);
        text-align: center;
      }

      /* ---- tutorial coach ----------------------------------------- */
      /* Centred and large on purpose: the instruction is the most important
         thing on screen while it is up, and a small strip at the bottom was
         competing with the table for attention and losing. */
      /* THE SPOTLIGHT.
         A pop-up that names a thing on the table is only half an instruction —
         the player still has to find the thing. Dimming everything except a
         circle around it turns "the red bar is the goal" into a pointer. The
         cutout is a radial gradient mask so it feathers rather than cutting a
         hard hole in the felt. */
      #coach-spot {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
        z-index: 30;
        /* The ending shape is twice the spotlight's half-extents, so the stops
           read as halves of it: clear out to the shape, then as much again of
           feather. Feathering over a fixed fraction of the SCREEN instead put
           the whole table at full dim a few pixels outside the ring, on a scene
           that is already nearly black — the felt stopped existing rather than
           receding. */
        background: radial-gradient(
          ellipse calc(var(--spot-rx, 90px) * 2) calc(var(--spot-ry, 90px) * 2)
            at var(--spot-x, 50%) var(--spot-y, 50%),
          rgba(5, 7, 10, 0) 0%,
          rgba(5, 7, 10, 0) 50%,
          rgba(5, 7, 10, 0.52) 100%
        );
      }
      #coach-spot.show { opacity: 1; }

      /* A ring on the spotlit thing, so it reads as "this one" and not just as
         a brighter patch of table. */
      #coach-ring {
        position: absolute;
        left: var(--spot-x, 50%);
        top: var(--spot-y, 50%);
        width: calc(var(--spot-rx, 90px) * 2);
        height: calc(var(--spot-ry, 90px) * 2);
        margin-left: calc(var(--spot-rx, 90px) * -1);
        margin-top: calc(var(--spot-ry, 90px) * -1);
        /* A capsule, not a circle: it has to hug a wide flat goal bar and a
           tall narrow rack with the same rule. */
        border-radius: 999px;
        /* Dashed and faint on purpose. A solid white capsule reads as an OBJECT
           on the felt and competes with the called pocket, which is the one
           thing on screen allowed to be bright white. This is a region marker:
           it says "the sentence is about what's in here", nothing more. */
        border: 1.5px dashed rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 14px rgba(255, 255, 255, 0.09);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
        z-index: 31;
      }
      /* The animation is attached ONLY in the shown state. Declared on the base
         rule it kept setting `opacity` every frame, and a running animation
         outranks the plain `opacity: 0` above it — so the ring stayed on screen
         after its lesson was over, floating over a finished table. */
      #coach-ring.show {
        opacity: 1;
        animation: spot-pulse 1.9s ease-in-out infinite;
      }
      @keyframes spot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.72; }
      }

      /* THE GHOST HAND.
         A card can name the gesture; only a demonstration teaches it. This is a
         finger that presses behind the ball, draws back along the cue's own
         axis to the distance that means full power, and releases — on a loop,
         until the player does it themselves.
         Both ends are projected from world space by Tutorial._updateHand, so the
         path is the actual draw corridor rather than a guess at one. */
      #coach-hand-track {
        position: absolute;
        left: var(--hand-x, 50%);
        top: var(--hand-y, 50%);
        width: var(--hand-len, 0px);
        height: 3px;
        margin-top: -1.5px;
        transform-origin: 0 50%;
        transform: rotate(var(--hand-rot, 0deg));
        border-radius: 2px;
        background: linear-gradient(
          to right,
          rgba(255, 255, 255, 0.06),
          rgba(255, 255, 255, 0.42)
        );
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 32;
      }
      #coach-hand-track.show { opacity: 1; }

      #coach-hand {
        position: absolute;
        left: var(--hand-x, 50%);
        top: var(--hand-y, 50%);
        width: 46px;
        height: 46px;
        margin-left: -23px;
        margin-top: -23px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.92);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.4) 0%,
          rgba(255, 255, 255, 0.14) 55%,
          rgba(255, 255, 255, 0) 72%
        );
        box-shadow: 0 0 18px rgba(255, 255, 255, 0.5);
        opacity: 0;
        pointer-events: none;
        z-index: 33;
      }
      /* Animation lives in the shown state only — the ring above taught us why. */
      #coach-hand.show {
        animation: hand-draw 2.6s cubic-bezier(0.33, 0, 0.3, 1) infinite;
      }
      @keyframes hand-draw {
        0%   { opacity: 0; transform: translate(0, 0) scale(1.35); }
        10%  { opacity: 1; transform: translate(0, 0) scale(1); }
        18%  { opacity: 1; transform: translate(0, 0) scale(0.88); }
        58%  { opacity: 1; transform: translate(var(--hand-dx, 0px), var(--hand-dy, 0px)) scale(0.88); }
        70%  { opacity: 1; transform: translate(var(--hand-dx, 0px), var(--hand-dy, 0px)) scale(0.88); }
        78%  { opacity: 0.9; transform: translate(var(--hand-dx, 0px), var(--hand-dy, 0px)) scale(1.6); }
        88%  { opacity: 0; transform: translate(var(--hand-dx, 0px), var(--hand-dy, 0px)) scale(1.8); }
        100% { opacity: 0; transform: translate(0, 0) scale(1.35); }
      }

      /* ---- the coaching band -------------------------------------- *
         OPTION C: THE RAIL AND THE ROUTE. See docs/COACHING.md.

         One sentence, on a strip of FIXED height pinned between the HUD and
         the felt. It never moves, never fades and never overlaps the table,
         which is the whole point: the card this replaces lived over the play
         area at 12.5% and had to drop to nine per cent opacity the instant a
         thumb went down, so the words were taken away at exactly the moment
         the player might want to re-read them.

         The vertical budget it belongs to:
           0-11%    HUD band
           11-19%   this band, fixed, whatever the state
           28-64%   every rack, every target, every route
           ~70%     the ball's spawn
           70-100%  where the thumb goes

         Four states — instruct, aiming, missed, complete — differ only in the
         sentence and the colour. Nothing appears, nothing disappears, nothing
         moves, so there is no animation to wait through and no layout shift to
         re-find the words after.                                              */
      #coach {
        position: absolute;
        left: 0;
        right: 0;
        /* ANCHORED TO THE TABLE, NOT TO A PERCENTAGE.
           The camera frames the arena edge to edge, so the felt has no margin
           and there is exactly one horizontal strip of it with nothing in it:
           between the bottom of the far corner pockets and the top of anything
           a board can place. `--coach-top` is that strip's top edge, measured
           from the live pocket geometry on every resize (see layoutBand in
           main.js). The 11% fallback is what it works out to on a 9:16 phone —
           it is here so the band still lands somewhere sane if it is ever
           shown before a layout pass, not as the real answer. */
          top: var(--coach-top, 11%);
        display: flex;
        align-items: center;
        gap: 10px;
        /* FIXED HEIGHT, TWO LINES OF ROOM. The band's value is that it is
           always the same shape in the same place; sizing it to its content
           would give that away on the first board whose sentence wraps. Two
           lines at this size is about 64 characters, which is the budget every
           string in RULES is written to. */
        height: 46px;
        padding: 0 12px;
        box-sizing: border-box;
        background: rgba(5, 7, 10, 0.94);
        border-top: 1px solid rgba(29, 111, 122, 0.35);
        border-bottom: 1.5px solid rgba(29, 111, 122, 0.55);
        opacity: 0;
        transition: opacity 0.22s ease, border-color 0.24s ease;
        /* Pointer-transparent as a whole so it can never eat an aim; only the
           Next button takes taps. */
        pointer-events: none;
        z-index: 40;
      }
      #coach.show { opacity: 1; }

      #coach .line {
        flex: 1;
        min-width: 0;
        font-size: clamp(12px, 3.2vmin, 15px);
        font-weight: 700;
        line-height: 1.18;
        letter-spacing: -0.005em;
        color: var(--bone, #eaf6ff);
        /* Two lines, then clip. A third would push the band's height around,
           and a sentence needing three lines is the wrong sentence — the
           endpoint tags on the felt carry what will not fit. */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-wrap: balance;
      }
      /* THE SAME COLOUR ALLOCATION AS THE TABLE. A ball named in the sentence
         takes the rack's amber and the good thing takes green, so the word and
         the object it names are the same colour. Pocket names stay the band's
         own bone-white, which is what a called pocket is lit in. */
      #coach .line b {
        font-weight: 800;
        color: var(--amber, #ffb340);
      }
      #coach .line em {
        font-style: normal;
        font-weight: 800;
        color: #2ef2c4;
      }
      #coach.bad .line { color: #ff8f7a; }
      #coach.bad .line b,
      #coach.bad .line em { color: #ff5a3d; }
      #coach.good .line { color: #2ef2c4; }
      #coach.good .line b,
      #coach.good .line em { color: #2ef2c4; }

      #coach.bad { border-bottom-color: #ff5a3d; }
      #coach.good { border-bottom-color: #2ef2c4; }

      /* Where the old card's "Lesson 2 of 6" eyebrow went. Two numerals,
         because the sentence has the left side and a player two boards in
         wants to know how many are left rather than read the phrase again. */
      #coach .prog {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: #7c8794;
        white-space: nowrap;
      }
      #coach .prog[hidden] { display: none; }

      /* The CTA takes the progress chip's PLACE rather than sitting beside it:
         on a finished board there is exactly one control, and it goes forward. */
      #coach .next {
        display: block;
        padding: 6px 15px;
        font-family: inherit;
        font-size: clamp(11.5px, 3vmin, 14px);
        font-weight: 800;
        letter-spacing: 0.02em;
        white-space: nowrap;
        color: #04120e;
        background: #2ef2c4;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 0 22px rgba(46, 242, 196, 0.5);
        animation: nextPop 0.28s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      /* Gated on .show: a hidden band must not leave a live target behind, and
         opacity alone does not stop hit-testing. */
      #coach.show .next { pointer-events: auto; }
      #coach .next:active { transform: scale(0.96); }
      #coach .next[hidden] { display: none; }
      @keyframes nextPop {
        from { transform: scale(0.7); opacity: 0; }
        to   { transform: scale(1); opacity: 1; }
      }

      /* A COMPLETED LESSON IS NOT A LIVE TABLE. The felt behind dims so the eye
         goes to the one live control, and the table stops taking shots (see
         Tutorial.awaitingNext, read by the input gate). */
      #coach.done::after {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(5, 7, 10, 0.42);
        z-index: -1;
        pointer-events: none;
        animation: doneVeil 0.4s ease both;
      }
      @keyframes doneVeil { from { opacity: 0; } to { opacity: 1; } }

      /* The spotlight scrim still steps back while a thumb is down — it dims
         the felt, and dim felt is useful while READING about the table and
         squarely unhelpful while aiming across it. The band does not, because
         it is not on the felt in the first place. */
      #ui-layer.aiming #coach-spot.show { opacity: 0.3; }
      #coach-spot { transition: opacity 0.16s ease; }

      /* THE WAY OUT LIVES IN THE HUD, NOT IN THE BAND.
         The band has room for one sentence and one control, and the control
         has to be the one that moves forward; a way out beside it at the same
         size is a way out that gets pressed by mistake. The HUD's score,
         contract and stroke readouts are all hidden during a lesson, so this
         corner is free. */
      #coach-skip {
        position: absolute;
        /* TOP CENTRE, not a corner. The two far corner pockets live in the
           corners of this band — that is the whole reason the hull readout is
           hidden during a lesson — so a control parked in either one is a
           control sitting in a pocket. The middle of the top edge is the only
           part of it that is never table. */
        top: calc(var(--hud-pad) + 1px);
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 11px;
        font-family: inherit;
        font-size: clamp(9px, 2.4vmin, 11px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6c7784;
        background: rgba(5, 7, 10, 0.5);
        border: 1px solid rgba(234, 246, 255, 0.14);
        border-radius: 999px;
        cursor: pointer;
        pointer-events: auto;
        z-index: 41;
      }
      #coach-skip:active { color: var(--bone); }
      #coach-skip[hidden] { display: none; }

      /* ---- endpoint tags ------------------------------------------- *
         The per-aim half of the instruction: what the route currently drawn
         actually DOES, named at the point it ends. Two shots that look almost
         identical on the felt — one that drops the 1 and one that leaves it an
         inch short — draw the same picture, and the difference is the shot.

         Colour is the channel of the ball whose route ends there: cyan for
         yours, amber for a rack ball; bone-white at a pocket, which is what a
         called pocket is lit in; red when that pocket is about to eat your own
         ball.                                                                */
      #coach-tags {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 38;
      }
      .coach-tag {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 2px 6px;
        border-radius: 5px;
        font-size: clamp(8.5px, 2.2vmin, 10px);
        font-weight: 700;
        letter-spacing: 0.1em;
        white-space: nowrap;
        background: rgba(5, 7, 10, 0.9);
        border: 1px solid currentColor;
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      .coach-tag.show { opacity: 1; }
      .coach-tag.cue { color: var(--cyan); }
      .coach-tag.rack { color: var(--amber); }
      .coach-tag.pocket { color: var(--bone); }
      .coach-tag.bad { color: #ff5a3d; }
      @media (prefers-reduced-motion: reduce) {
        .menu-title .ln { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="stage">
        <canvas id="stage-canvas"></canvas>
        <div id="ui-layer"></div>
        <div id="boot-veil">
          <div class="menu-inner" id="menu-main">
            <p class="menu-eyebrow">Dark Velvet Cyber-Billiards</p>
            <h1 class="menu-title" aria-label="Billiard Roguelike">
              <span class="ln">Billiard</span><span class="ln">Roguelike</span>
            </h1>
            <button id="btn-play" class="menu-btn primary" type="button">Play</button>
            <div class="menu-row">
              <button id="btn-settings" class="menu-btn" type="button">Settings</button>
              <button id="btn-mute" class="menu-btn" type="button" aria-pressed="false">Sound&nbsp;on</button>
            </div>
          </div>

          <div class="menu-inner" id="menu-settings" hidden>
            <h2 class="menu-sub">Settings</h2>
            <button id="set-mute" class="menu-btn" type="button">Sound: On</button>
            <button id="set-tutorial" class="menu-btn" type="button">Replay tutorial</button>
            <button id="set-back" class="menu-btn primary" type="button">Done</button>
            <p class="menu-foot" id="set-tutorial-state"></p>
          </div>
        </div>
      </div>
    </div>
    <div id="rotate-hint">Rotate your device to portrait</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
